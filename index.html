<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>台灣彈珠台 — 대만 핀볼</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 20%, #2a2433 0%, #161219 70%);
    color:#f5e9d3; font-family:'Segoe UI', 'Malgun Gothic', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  header { display:flex; align-items:center; gap:22px; padding:8px 0 4px; flex-wrap:wrap; justify-content:center; }
  h1 { font-size:24px; color:#ffd24a; text-shadow:0 0 14px rgba(255,180,40,.45); letter-spacing:2px; }
  h1 span { font-size:12px; color:#e8c89a; letter-spacing:4px; margin-left:8px; }
  #hud { display:flex; gap:14px; }
  .stat { background:rgba(0,0,0,.4); border:1px solid #5a4632; border-radius:10px; padding:3px 14px; text-align:center; min-width:96px; }
  .stat label { font-size:10px; color:#bca06f; letter-spacing:2px; }
  .stat > div { font-size:19px; font-weight:bold; color:#ffe9b0; font-variant-numeric:tabular-nums; }
  #marbles { color:#8fe3ff !important; }
  #stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas {
    height:100%; max-height:920px; aspect-ratio:560/920; width:auto;
    border-radius:14px; box-shadow:0 10px 50px rgba(0,0,0,.7), 0 0 0 4px #1c1410, 0 0 0 6px #6b4a26;
    touch-action:none; cursor:pointer;
  }
  #betbar { display:flex; align-items:center; gap:8px; padding:8px 0 2px; }
  #betbar button {
    font-size:15px; font-weight:bold; border:none; border-radius:8px; cursor:pointer;
    padding:8px 13px; background:#3b2c1c; color:#ffe9b0; border:1px solid #6b4a26;
    transition:transform .06s, background .15s;
  }
  #betbar button:hover:not(:disabled) { background:#54401f; }
  #betbar button:active:not(:disabled) { transform:scale(.93); }
  #betbar button:disabled { opacity:.35; cursor:default; }
  #betAmt {
    width:96px; text-align:center; font-size:20px; font-weight:bold; color:#8fe3ff;
    background:rgba(0,0,0,.5); border:1px solid #4a6a7a; border-radius:8px; padding:6px 8px;
    font-variant-numeric:tabular-nums; -moz-appearance:textfield;
  }
  #betAmt:focus { outline:none; border-color:#8fe3ff; box-shadow:0 0 0 2px rgba(143,227,255,.3); }
  #betAmt::-webkit-outer-spin-button, #betAmt::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  #insert {
    background:linear-gradient(180deg,#ffd56b,#e09a2d) !important; color:#3a2305 !important;
    font-size:16px !important; padding:9px 22px !important;
    box-shadow:0 3px 0 #8a5d14; border:none !important;
  }
  #insert:disabled { box-shadow:none; }
  #hint { font-size:12px; color:#a78d62; padding:4px 0 10px; text-align:center; line-height:1.5; }
  #hint b { color:#e85d5d; }
  #overlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(10,6,4,.8); border-radius:14px; backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .5s;
  }
  #overlay.show { opacity:1; pointer-events:auto; }
  #panel { text-align:center; padding:32px 48px; background:linear-gradient(170deg,#3b2a18,#241708); border:3px solid #c89b4a; border-radius:18px; box-shadow:0 0 40px rgba(255,190,80,.25); }
  #panel h2 { color:#ffd24a; font-size:28px; margin-bottom:10px; text-shadow:0 0 12px rgba(255,180,40,.6); }
  #ovStats { font-size:15px; color:#e8c89a; margin-bottom:18px; line-height:1.8; }
  #ovStats b { color:#fff3d0; font-size:19px; }
  #restart {
    font-size:18px; font-weight:bold; padding:12px 38px; border-radius:30px; border:none; cursor:pointer;
    background:linear-gradient(180deg,#ffd56b,#e09a2d); color:#3a2305;
    box-shadow:0 4px 0 #8a5d14, 0 8px 18px rgba(0,0,0,.5); transition:transform .08s;
  }
  #restart:active { transform:translateY(3px); box-shadow:0 1px 0 #8a5d14; }
  /* ----- online leaderboard ----- */
  #main { flex:1; display:flex; gap:16px; align-items:stretch; min-height:0; padding:0 10px; }
  #left { display:flex; flex-direction:column; align-items:center; min-height:0; }
  #lbPanel {
    width:252px; align-self:center; max-height:calc(100vh - 120px);
    background:linear-gradient(170deg,#2e2113,#1d1409); border:2px solid #6b4a26; border-radius:14px;
    padding:14px; display:flex; flex-direction:column; gap:8px; overflow:hidden auto;
  }
  #lbPanel h2 { font-size:16px; color:#ffd24a; text-align:center; letter-spacing:1px; }
  #lbStatus { font-size:11px; color:#a78d62; text-align:center; min-height:14px; }
  #lbList { list-style:none; display:flex; flex-direction:column; gap:4px; font-size:13px; }
  #lbList li { display:flex; justify-content:space-between; background:rgba(0,0,0,.3); padding:5px 9px; border-radius:7px; }
  #lbList li.mine { outline:1px solid #ffd24a; background:rgba(255,210,74,.12); }
  #lbList li:first-child { font-size:15px; }
  .lbName { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:8px; }
  .lbScore { color:#8fe3ff; font-weight:bold; font-variant-numeric:tabular-nums; }
  .nickRow { display:flex; gap:6px; }
  .nickRow input {
    flex:1; min-width:0; background:#120b04; border:1px solid #6b4a26; color:#ffe9b0;
    border-radius:7px; padding:7px 9px; font-size:13px;
  }
  .nickRow button {
    border:none; border-radius:7px; padding:7px 12px; font-weight:bold; cursor:pointer;
    background:linear-gradient(180deg,#ffd56b,#e09a2d); color:#3a2305;
  }
  #lbMsg, #ovMsg { font-size:12px; color:#7CFC9A; text-align:center; min-height:15px; }
  #ovSubmit { margin-bottom:14px; }
  #ovSubmit .nickRow input { font-size:15px; }
  /* ----- hall of fame ----- */
  #hofBox {
    background:linear-gradient(170deg,#3a2c08,#1c1503); border:2px solid #d4af37; border-radius:12px;
    padding:10px 12px; margin-bottom:6px; box-shadow:0 0 18px rgba(212,175,55,.25) inset;
  }
  #hofBox h2 {
    font-size:16px; text-align:center; letter-spacing:1px;
    background:linear-gradient(90deg,#ffe9a8,#ffd24a,#e8930c,#ffd24a,#ffe9a8);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 12px rgba(255,200,80,.4);
  }
  #hofSub { font-size:10px; color:#c9a94a; text-align:center; letter-spacing:2px; margin-bottom:6px; }
  #hofList { list-style:none; display:flex; flex-direction:column; gap:4px; font-size:13px; }
  #hofList li { display:flex; justify-content:space-between; gap:8px; padding:5px 9px; border-radius:7px;
    background:rgba(212,175,55,.1); border:1px solid rgba(212,175,55,.35); }
  #hofList li .lbName { color:#ffe9b0; }
  #hofList li .lbScore { color:#ffd24a; }
  #hofList li.mine { outline:2px solid #ffd24a; }
  #hofList .hofEmpty { justify-content:center; color:#9a8433; font-size:11px; background:none; border:none; }
  #ovHof {
    display:block; width:100%; margin:12px 0 2px; padding:12px 0; border:none; border-radius:12px; cursor:pointer;
    font-size:15px; font-weight:bold; color:#3a2600; letter-spacing:1px;
    background:linear-gradient(180deg,#ffe9a8,#f0b93a,#d4901c);
    box-shadow:0 3px 0 #8a5d14, 0 0 22px rgba(255,200,80,.5);
    animation:hofGlow 1.4s ease-in-out infinite;
  }
  #ovHof:active { transform:translateY(2px); box-shadow:0 1px 0 #8a5d14; }
  @keyframes hofGlow { 0%,100%{ box-shadow:0 3px 0 #8a5d14, 0 0 16px rgba(255,200,80,.4); } 50%{ box-shadow:0 3px 0 #8a5d14, 0 0 30px rgba(255,220,120,.85); } }
  #ovHofMsg { font-size:12px; color:#ffd24a; text-align:center; min-height:15px; }
  /* ---- tablet / stacked ---- */
  @media (max-width: 960px){
    body { overflow:auto; height:auto; }
    #main { flex-direction:column; align-items:center; padding:0 8px; }
    #left { width:100%; }
    #stage { flex:none; width:100%; }
    canvas { height:auto; width:100%; max-width:min(560px, 96vw); max-height:none; }
    #lbPanel { width:min(560px, 96vw); max-height:none; }
  }
  /* ---- phones ---- */
  @media (max-width: 560px){
    header { gap:8px; padding:6px 4px 2px; }
    h1 { font-size:19px; letter-spacing:1px; }
    h1 span { font-size:10px; letter-spacing:2px; margin-left:4px; }
    #hud { gap:7px; }
    .stat { min-width:0; flex:1; padding:3px 6px; border-radius:8px; }
    .stat label { font-size:9px; letter-spacing:1px; }
    .stat > div { font-size:16px; }
    #hud { width:100%; }
    #betbar { gap:5px; flex-wrap:wrap; justify-content:center; padding:8px 4px 2px; }
    #betbar button { padding:11px 12px; font-size:15px; }
    #betAmt { width:74px; font-size:18px; padding:9px 4px; }
    #insert { width:100%; order:9; padding:13px 0 !important; font-size:17px !important; }
    #hint { font-size:11px; padding:6px 6px 14px; }
    #panel { padding:24px 22px; width:92vw; }
    #panel h2 { font-size:22px; }
    #restart { font-size:16px; padding:12px 24px; }
  }
  /* bigger touch targets on coarse pointers */
  @media (pointer: coarse){
    #betbar button { min-height:44px; }
    .nickRow button, .nickRow input { min-height:42px; }
  }
</style>
</head>
<body>
<header>
  <h1>台灣彈珠台<span>대 만 핀 볼</span></h1>
  <div id="hud">
    <div class="stat"><label>보유 구슬</label><div id="marbles">100</div></div>
    <div class="stat"><label>최고 기록</label><div id="best">0</div></div>
    <div class="stat"><label>판 수</label><div id="rounds">0</div></div>
  </div>
</header>
<div id="main">
<div id="left">
<div id="stage">
  <canvas id="game" width="560" height="920"></canvas>
  <div id="overlay">
    <div id="panel">
      <h2 id="ovTitle">게임 종료</h2>
      <div id="ovStats"></div>
      <div id="ovSubmit">
        <div style="font-size:14px;color:#e8c89a;margin-bottom:8px;">최고 기록 <b id="ovBest" style="color:#8fe3ff;">0</b>개 — 온라인 랭킹에 올려보세요!</div>
        <div class="nickRow"><input id="ovNick" maxlength="12" placeholder="닉네임 (최대 12자)"><button id="ovSend">🌐 랭킹 등록</button></div>
        <div id="ovMsg"></div>
        <button id="ovHof" style="display:none;">🏛️ 명예의 전당에 이름 새기기</button>
        <div id="ovHofMsg"></div>
      </div>
      <button id="restart">🔄 구슬 100개로 다시 시작</button>
    </div>
  </div>
</div>
<div id="betbar">
  <button data-d="-10">−10</button>
  <button data-d="-1">−1</button>
  <input id="betAmt" type="number" inputmode="numeric" min="1" value="10" aria-label="배팅할 구슬 수">
  <button data-d="1">+1</button>
  <button data-d="10">+10</button>
  <button id="betMax">MAX</button>
  <button id="insert">🎱 구슬 투입</button>
</div>
<p id="hint">
  구슬을 투입하면 룰렛이 배율을 정하고, <b>빨간 LED</b>가 켜진 구멍에 넣으면 <b>배팅 × 배율</b>만큼 받아요! (빗나가면 몰수)<br>
  배율별 LED 구멍 수 (12칸 중) — ×2→4칸 · ×4→3칸 · ×5→3칸 · ×8→2칸 · ×10→2칸 · ×15→1칸 · ×20→1칸 · 🏆 무한 플레이! 최고 기록에 도전하세요
</p>
</div>
<aside id="lbPanel">
  <div id="hofBox">
    <h2>🏛️ 명예의 전당</h2>
    <div id="hofSub">兆(조)를 넘어선 전설들</div>
    <ol id="hofList"></ol>
  </div>
  <h2>🌐 실시간 랭킹 TOP 20</h2>
  <div id="lbStatus">불러오는 중...</div>
  <ol id="lbList"></ol>
  <div class="nickRow"><input id="nick" maxlength="12" placeholder="닉네임"><button id="lbSend">기록 등록</button></div>
  <div id="lbMsg"></div>
</aside>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
'use strict';
/* ============================================================
   台灣彈珠台 — Taiwanese betting pinball machine
   bet marbles → roulette picks multiplier → red-LED holes →
   one shot: lit hole = bet × multiplier, miss = lose the bet
   ============================================================ */
const cv = document.getElementById('game');
const cx2d = cv.getContext('2d');
const W = 560, H = 920;

/* ---------- board geometry ---------- */
const WALL    = 12;
const ARC_CY  = 280;             // top dome centre y
const ARC_R   = W/2 - WALL;      // 268
const LANE_X  = 500;             // launch-lane wall centre x
const LANE_W  = 4;
const LANE_TOP= 292;
const FLOOR_Y = 908;
const BALL_R  = 6.5;
const PLUNGER_X = 524;

const SLOT_N  = 12;
const SLOT_L  = WALL, SLOT_R = LANE_X - LANE_W;     // 12 .. 496
const SLOT_W  = (SLOT_R - SLOT_L) / SLOT_N;         // ≈16.1
const SLOT_TOP = 760;
const LED_Y   = 750;

const GRAVITY = 1700;
const START_MARBLES = 100;

/* multiplier → number of lit holes (higher = harder) */
const MULT_INFO = {
  2:{n:4,color:'#4a7fc1'}, 4:{n:3,color:'#3fa05a'}, 5:{n:3,color:'#2aa198'},
  8:{n:2,color:'#d07a2a'}, 10:{n:2,color:'#9b59b6'}, 15:{n:1,color:'#d4242a'},
  20:{n:1,color:'#d4af37'},
};
/* roulette wheel: 16 weighted segments */
const SEGS = [2,4,5,2,8,4,10,2,15,5,4,2,8,20,5,2];
const SEG_A = Math.PI*2 / SEGS.length;

/* ---------- nail pins ---------- */
const pins = [];
for (let row = 0; row < 12; row++){
  const y = 330 + row * 34;
  const offset = (row % 2) ? 18 : 0;
  for (let x = 30 + offset; x <= 470; x += 36)
    pins.push({ x, y, r:3.5, f:0 });
}
/* ---------- slot dividers ---------- */
const dividers = [];
for (let i = 1; i < SLOT_N; i++)
  dividers.push({ x: SLOT_L + SLOT_W*i, y1: SLOT_TOP, y2: FLOOR_Y });

/* ---------- game state ---------- */
let state = 'BET';               // BET → SPIN → SHOOT → RESULT → OVER
let marbles = START_MARBLES;
let bet = 10;
let wager = 0;                   // locked-in bet for the current round (never clamped mid-round)
let mult = 0;
let litSlots = [];               // revealed LEDs (grows during reveal)
let litChosen = [];              // full chosen set
let rounds = 0;
let best = +(localStorage.getItem('tw-pinball-best') || 0);
let gen = 0;                     // generation guard for timeouts
let balls = [];
let charging = false, power = 0, lastTickPower = 0, plungerAnim = 0;
let popups = [], shake = 0;
let particles = [];          // payout marble fountain + sparkles
let flash = 0;               // gold screen flash on big wins
let banner = null;           // {txt, sub, t, dur, tier}
let rings = [];              // expanding shock rings {x,y,r,maxR,t,dur,color,lw}
let confetti = [];           // falling confetti {x,y,vx,vy,rot,vr,w,h,hue,t,dur,shape}
let fireworks = [];          // scheduled bursts {x,y,delay,hue,n}
let rays = null;             // god-ray burst {x,y,t,dur,tier}
let borderGlow = 0;          // neon screen-edge glow intensity
let rainbow = 0;             // rainbow strobe timer (top tiers)
let stateMsg = '';

const roul = { angle: 0, spinning:false, t:0, dur:3, from:0, total:0, lastSeg:-1, resultMult:0 };

function safeTimeout(fn, ms){
  const g = gen;
  setTimeout(()=>{ if (g === gen) fn(); }, ms);
}

function newBall(){
  return {
    x: PLUNGER_X, y: 0, vx:0, vy:0, r: BALL_R,
    state:'ready', launched:false, contact:false, settle:0, slow:0,
    rot:0, hue: 170 + Math.random()*160, trail:[],
  };
}
function currentBall(){ return balls.find(b => b.state !== 'done'); }

function updateHUD(){
  if (marbles > best){ best = marbles; localStorage.setItem('tw-pinball-best', best); }
  document.getElementById('marbles').textContent = marbles.toLocaleString();
  document.getElementById('best').textContent = Math.max(best, marbles).toLocaleString();
  document.getElementById('rounds').textContent = rounds;
  if (state === 'BET') bet = Math.max(1, Math.min(bet, Math.max(1, marbles)));
  const betEl = document.getElementById('betAmt');
  if (document.activeElement !== betEl) betEl.value = bet;
  const canBet = state === 'BET' && marbles > 0;
  document.querySelectorAll('#betbar button').forEach(b => b.disabled = !canBet);
  betEl.disabled = !canBet;
  if (typeof checkTheme === 'function') checkTheme();
}

/* ============================================================
   AUDIO — synthesized with Web Audio
   ============================================================ */
let AC = null, rollGain = null, rollFilter = null, master = null;
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
  const len = AC.sampleRate;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  rollFilter = AC.createBiquadFilter();
  rollFilter.type = 'bandpass'; rollFilter.frequency.value = 460; rollFilter.Q.value = 0.8;
  rollGain = AC.createGain(); rollGain.gain.value = 0;
  src.connect(rollFilter); rollFilter.connect(rollGain); rollGain.connect(master);
  src.start();
}
function blip(type, freq, dur, vol, freqEnd, when=0){
  if (!AC) return;
  const t0 = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0+dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
}
function noiseBurst(dur, vol, freq, when=0){
  if (!AC) return;
  const t0 = AC.currentTime + when;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t0);
}
let lastPing = 0;
function sndPin(impact){
  const now = performance.now();
  if (now - lastPing < 26) return;
  lastPing = now;
  const v = Math.min(1, impact/900);
  blip('triangle', 1600 + Math.random()*900 + v*500, 0.05+v*0.05, 0.04 + v*0.2, 850);
  blip('sine', 3300 + Math.random()*1200, 0.035, v*0.07, 2100);
}
function sndWall(impact){
  const v = Math.min(1, impact/1000);
  if (v < 0.12) return;
  noiseBurst(0.05, v*0.22, 500);
  blip('sine', 150, 0.07, v*0.28, 65);
}
function sndClack(when=0, vol=0.2){             // marble clack (insert / payout)
  noiseBurst(0.025, vol, 1600, when);
  blip('sine', 800 + Math.random()*500, 0.03, vol*0.7, 500, when);
}
function sndInsert(n){
  const k = Math.min(n, 12);
  for (let i = 0; i < k; i++) sndClack(i*0.045, 0.18);
}
function sndTick(){ blip('square', 1300, 0.025, 0.07, 900); }
function sndMultStop(m){
  blip('triangle', 660, 0.15, 0.25, 660);
  blip('triangle', 880, 0.25, 0.25, 880, 0, 0.1);
  if (m >= 10) blip('triangle', 1320, 0.3, 0.22, 1320, 0, 0.2);
}
function sndLed(i){ blip('square', 900 + i*90, 0.07, 0.12, 880 + i*90); }
function sndRatchet(){
  noiseBurst(0.02, 0.12, 2500);
  blip('square', 220 + power*260, 0.025, 0.05, 140);
}
function sndLaunch(p){
  noiseBurst(0.08, 0.3, 1800);
  blip('triangle', 110 + p*90, 0.22, 0.35, 50);
  blip('sine', 300 + p*250, 0.1, 0.2, 90);
}
function sndWin(payout, tier){
  // ascending fanfare — longer & grander with tier
  const scale = [523,587,659,784,880,1047,1175,1319,1568,1760,2093,2349,2637];
  const len = Math.min(scale.length, 3 + tier*2);
  for (let i = 0; i < len; i++){
    const f = scale[i], when = i*0.085;
    blip('triangle', f, 0.32, 0.22, f, when);

function doInsert(){
  initAudio();
  if (state !== 'BET' || marbles <= 0) return;
  bet = Math.max(1, Math.min(bet, marbles));
  wager = bet;                   // lock in the bet for this round
  marbles -= wager;
  rounds++;
  sndInsert(wager);
  state = 'SPIN';
  stateMsg = '🎰 룰렛 회전 중...';
  startSpin();
  updateHUD();
}
function startSpin(){
  const tIdx = Math.floor(Math.random() * SEGS.length);
  roul.resultMult = SEGS[tIdx];
  // final angle puts target segment centre under the top pointer
  const desired = -Math.PI/2 - (tIdx + 0.5)*SEG_A + (Math.random()-0.5)*SEG_A*0.6;
  const delta = ((desired - roul.angle) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  roul.from = roul.angle;
  roul.total = Math.PI*8 + delta;
  roul.t = 0; roul.dur = 2.8 + Math.random()*0.5;
  roul.spinning = true;
  roul.lastSeg = segUnderPointer();
}
function segUnderPointer(){
  const rel = ((-Math.PI/2 - roul.angle) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  return Math.floor(rel / SEG_A) % SEGS.length;
}
function onSpinEnd(){
  mult = roul.resultMult;
  const info = MULT_INFO[mult];
  sndMultStop(mult);
  stateMsg = `×${mult} 당첨! LED 구멍 ${info.n}개 점등 중...`;
  // pick lit holes
  const idxs = Array.from({length:SLOT_N}, (_,i)=>i);
  for (let i = idxs.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
  }
  litChosen = idxs.slice(0, info.n).sort((a,b)=>a-b);
  litSlots = [];
  litChosen.forEach((slot, i)=>{
    safeTimeout(()=>{ litSlots.push(slot); sndLed(i); }, 500 + i*180);
  });
  safeTimeout(()=>{
    state = 'SHOOT';
    stateMsg = `×${mult} — 빨간 LED 구멍을 노려라! (배팅 ${wager}개)`;
    balls.push(newBall());
    updateHUD();
  }, 500 + litChosen.length*180 + 350);
}

function winTier(payout){
  if (payout >= 100000000) return 7;   // 억
  if (payout >=  10000000) return 6;   // 천만
  if (payout >=   1000000) return 5;   // 백만
  if (payout >=    100000) return 4;   // 십만
  if (payout >=     10000) return 3;   // 만
  if (payout >=      1000) return 2;   // 천
  return 1;
}

function resolveRound(b){

/* ============================================================
   PHYSICS
   ============================================================ */
function plungerTipY(){ return 856 + power*36 - plungerAnim*22; }

function collideSegment(b, x1,y1,x2,y2, rad, e){
  const dx = x2-x1, dy = y2-y1;
  const len2 = dx*dx + dy*dy;
  let t = ((b.x-x1)*dx + (b.y-y1)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const px = x1 + t*dx, py = y1 + t*dy;
  let nx = b.x - px, ny = b.y - py;
  const d = Math.hypot(nx, ny), min = rad + b.r;
  if (d < min && d > 0.0001){
    nx /= d; ny /= d;
    b.x = px + nx*min; b.y = py + ny*min;
    const vn = b.vx*nx + b.vy*ny;
    if (vn < 0){ b.vx -= (1+e)*vn*nx; b.vy -= (1+e)*vn*ny; return -vn; }
    b.contact = true;
    return 0;
  }
  return -1;
}

function stepBall(b, dt){
  if (b.state !== 'live') return;
  b.vy += GRAVITY * dt;
  b.x  += b.vx * dt;
  b.y  += b.vy * dt;
  b.rot += b.vx * dt / b.r;
  b.contact = false;
  const speed = Math.hypot(b.vx, b.vy);

  /* top dome */
  if (b.y < ARC_CY){
    const dx = b.x - W/2, dy = b.y - ARC_CY;
    const d = Math.hypot(dx, dy);
    if (d > ARC_R - b.r){
      const nx = -dx/d, ny = -dy/d;
      b.x = W/2 + dx/d * (ARC_R - b.r);
      b.y = ARC_CY + dy/d * (ARC_R - b.r);
      const vn = b.vx*nx + b.vy*ny;
      if (vn < 0){
        b.vx -= 1.42*vn*nx; b.vy -= 1.42*vn*ny;
        if (-vn > 120) sndWall(-vn);
      }
      b.vx *= 0.996; b.vy *= 0.996;     // dome friction — no free ride to the far wall
      b.contact = true;
      if (b.x < 470) b.launched = true;
    }
  } else {
    if (b.x - b.r < WALL)     { b.x = WALL + b.r;     if (b.vx < 0){ sndWall(-b.vx); b.vx *= -0.45; } b.contact = true; }
    if (b.x + b.r > W - WALL) { b.x = W - WALL - b.r; if (b.vx > 0){ sndWall(b.vx);  b.vx *= -0.45; } b.contact = true; }
  }
  if (b.x < 470) b.launched = true;

  /* launch lane wall */
  collideSegment(b, LANE_X, LANE_TOP, LANE_X, FLOOR_Y, LANE_W, 0.45);

  /* one-way gate over the lane mouth */
  if (b.launched && b.x > LANE_X - LANE_W - b.r && b.y < 296 && b.vy > -50){
    const imp = collideSegment(b, LANE_X - LANE_W, 290, W - WALL, 284, 2.5, 0.3);
    if (imp > 150) sndWall(imp);
  }

  /* nail pins */
  for (const p of pins){
    const dx = b.x - p.x, dy = b.y - p.y;
    const d2 = dx*dx + dy*dy, min = p.r + b.r;
    if (d2 < min*min && d2 > 0.001){
      const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
      b.x = p.x + nx*min; b.y = p.y + ny*min;
      const vn = b.vx*nx + b.vy*ny;
      if (vn < 0){
        const e = 0.42 + Math.random()*0.12;
        b.vx -= (1+e)*vn*nx; b.vy -= (1+e)*vn*ny;
        b.vx += (Math.random()-0.5) * 24;
        sndPin(-vn);
        p.f = 1;
      }
      b.contact = true;
    }
  }

  /* slot dividers */
  for (const dv of dividers){
    const imp = collideSegment(b, dv.x, dv.y1, dv.x, dv.y2, 1.4, 0.38);
    if (imp > 160) sndPin(imp);
  }

  /* floor */
  if (b.y + b.r > FLOOR_Y){
    b.y = FLOOR_Y - b.r;
    if (b.vy > 0){
      if (b.vy > 140) sndWall(b.vy);
      b.vy *= -0.32;
    }
    b.vx *= 0.96;
    b.contact = true;
  }

  /* fell back into the lane → free retry on the plunger */
  if (!b.launched && b.x > LANE_X + LANE_W){
    const tip = plungerTipY();
    if (b.y + b.r > tip){
      b.y = tip - b.r;
      if (b.vy > 0){
        if (b.vy > 180){ sndWall(b.vy); b.vy *= -0.35; }
        else { b.vy = 0; b.vx = 0; b.state = 'ready'; }
      }
      b.contact = true;
    }
  }

  /* anti-stuck nudge */
  if (speed < 8 && b.y < 800 && b.state === 'live'){
    b.slow += dt;
    if (b.slow > 1.2){ b.vx += (Math.random()-0.5)*60; b.vy -= 30; b.slow = 0; }
  } else b.slow = 0;

  /* settled in a hole → resolve the round */
  if (b.launched && b.x < SLOT_R && b.y > 805 && b.contact && speed < 45){
    b.settle += dt;
    if (b.settle > 0.32) resolveRound(b);
  } else b.settle = 0;
}

function chargeStart(){

  if (state !== 'SHOOT') return;
  const b = currentBall();

    charging = true; power = 0; lastTickPower = 0;
  }
}
function chargeRelease(){
  if (!charging) return;
  charging = false;
  const b = currentBall();
  if (b && b.state === 'ready' && state === 'SHOOT'){
    b.state = 'live';
    b.launched = false; b.settle = 0; b.slow = 0;
    b.x = PLUNGER_X; b.y = plungerTipY() - b.r;
    b.vy = -(1450 + power*500);     // gentler spring: power controls landing zone
    b.vx = 0;
    sndLaunch(power);
    plungerAnim = 1;
  }
  power = 0;
}

function themeIdxFor(m){
  let idx = 0;
  for (let i = 0; i < THEMES.length; i++) if (m >= THEMES[i].from) idx = i;
  return idx;
}
let themeIdx = 0;
let themeFx = null;   // { name, t, dur } — level-up announcement

/* ============================================================
   RENDERING — static board on offscreen canvas (repainted per theme)
   ============================================================ */
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
function paintBoard(t){
  const g = bg.getContext('2d');
  g.clearRect(0,0,W,H);
  const wood = g.createLinearGradient(0,0,W,H);
  wood.addColorStop(0,t.wood[0]); wood.addColorStop(0.5,t.wood[1]); wood.addColorStop(1,t.wood[2]);
  g.fillStyle = wood; g.fillRect(0,0,W,H);
  g.globalAlpha = 0.14;
  for (let i = 0; i < 52; i++){
    g.strokeStyle = i%2 ? t.grainA : t.grainB;
    g.lineWidth = 1 + Math.random()*1.6;
    g.beginPath();
    const gx = Math.random()*W;
    g.moveTo(gx, 0);
    g.bezierCurveTo(gx+18, H*0.33, gx-22, H*0.66, gx+10, H);
    g.stroke();
  }
  g.globalAlpha = 1;

  // playfield inset
  g.save();
  g.beginPath();
  g.arc(W/2, ARC_CY, ARC_R, Math.PI, 0);
  g.lineTo(W-WALL, FLOOR_Y); g.lineTo(WALL, FLOOR_Y);
  g.closePath();
  const field = g.createLinearGradient(0,0,0,H);
  field.addColorStop(0,t.field[0]); field.addColorStop(1,t.field[1]);
  g.fillStyle = field; g.fill();
  g.clip();
  g.globalAlpha = 0.1;
  for (let i = 0; i < 34; i++){
    g.strokeStyle = t.fieldGrain; g.lineWidth = 1;
    g.beginPath();
    const gx = Math.random()*W;
    g.moveTo(gx,0); g.lineTo(gx + (Math.random()*40-20), H);
    g.stroke();
  }
  g.globalAlpha = 1;
  g.restore();

  // trim
  g.strokeStyle = t.trimDark; g.lineWidth = WALL*2;
  g.beginPath();
  g.arc(W/2, ARC_CY, ARC_R + WALL, Math.PI, 0);
  g.lineTo(W, H); g.lineTo(0, H);
  g.closePath(); g.stroke();
  g.strokeStyle = t.accent; g.lineWidth = 2.5;
  g.beginPath();
  g.arc(W/2, ARC_CY, ARC_R, Math.PI, 0);
  g.lineTo(W-WALL, FLOOR_Y); g.lineTo(WALL, FLOOR_Y);
  g.closePath(); g.stroke();

  // launch lane wall
  g.fillStyle = t.trimDark;
  g.beginPath();
  g.arc(LANE_X, LANE_TOP, LANE_W, Math.PI, 0);
  g.rect(LANE_X-LANE_W, LANE_TOP, LANE_W*2, FLOOR_Y-LANE_TOP);
  g.fill();
  g.strokeStyle = t.accentSoft; g.lineWidth = 1;
  g.strokeRect(LANE_X-LANE_W, LANE_TOP, LANE_W*2, FLOOR_Y-LANE_TOP);

  // lane arrows
  g.fillStyle = t.laneArrow;
  for (let y = 810; y > 360; y -= 60){
    g.beginPath();
    g.moveTo(PLUNGER_X, y-9); g.lineTo(PLUNGER_X-8, y+5); g.lineTo(PLUNGER_X+8, y+5);
    g.closePath(); g.fill();
  }

  // one-way gate flap
  g.strokeStyle = t.gate; g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(LANE_X-LANE_W, 290); g.lineTo(W-WALL, 284); g.stroke();

  // hole pockets + LED housings
  for (let i = 0; i < SLOT_N; i++){
    const x = SLOT_L + SLOT_W*i;
    const grad = g.createLinearGradient(0, SLOT_TOP, 0, FLOOR_Y);
    grad.addColorStop(0, i%2 ? t.pocketA : t.pocketB);
    grad.addColorStop(1, t.pocketBottom);
    g.fillStyle = grad;
    g.fillRect(x+1.4, SLOT_TOP, SLOT_W-2.8, FLOOR_Y-SLOT_TOP);
    // hole opening at the bottom
    g.beginPath();
    g.ellipse(x+SLOT_W/2, FLOOR_Y-7, SLOT_W/2-3, 4.5, 0, 0, Math.PI*2);
    g.fillStyle = t.hole; g.fill();
    // LED housing (off state)
    g.beginPath(); g.arc(x+SLOT_W/2, LED_Y, 3.4, 0, Math.PI*2);
    g.fillStyle = t.ledOff; g.fill();
    g.strokeStyle = t.ledOffStroke; g.lineWidth = 1; g.stroke();
  }

  // dividers
  for (const dv of dividers){
    g.fillStyle = t.divider;
    g.beginPath();
    g.arc(dv.x, dv.y1, 1.4, Math.PI, 0);
    g.rect(dv.x-1.4, dv.y1, 2.8, dv.y2-dv.y1);
    g.fill();
    g.fillStyle = t.dividerHi;
    g.fillRect(dv.x-0.5, dv.y1, 1, dv.y2-dv.y1);
  }

  // nails (metallic in every theme)
  for (const p of pins){
    g.beginPath(); g.arc(p.x+1, p.y+1.5, p.r, 0, Math.PI*2);
    g.fillStyle = 'rgba(0,0,0,.4)'; g.fill();
    const m = g.createRadialGradient(p.x-1.2, p.y-1.2, 0.4, p.x, p.y, p.r);
    m.addColorStop(0,'#fdfdfd'); m.addColorStop(0.5,'#b9bcc2'); m.addColorStop(1,'#6f7378');
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI*2);
    g.fillStyle = m; g.fill();
  }
}
function applyTheme(idx, announce){
  themeIdx = idx;
  paintBoard(THEMES[idx]);
  document.body.style.background = THEMES[idx].bodyBg;
  if (announce){
    themeFx = { name: THEMES[idx].name, t: 0, dur: 2.6 };
    flash = Math.max(flash, 0.7);
    shake = Math.max(shake, 0.7);
    // little ascending chime
    [523,659,784,1047,1319].forEach((f,i)=> blip('triangle', f, 0.3, 0.2, f, i*0.08));
  }
}
function checkTheme(){
  const idx = themeIdxFor(marbles);
  if (idx !== themeIdx) applyTheme(idx, idx > themeIdx);
}
applyTheme(0, false);

const WHEEL_X = W/2, WHEEL_Y = 172, WHEEL_R = 96;
function drawWheel(g, now){
  g.save();
  g.translate(WHEEL_X, WHEEL_Y);
  // rim
  g.beginPath(); g.arc(0, 0, WHEEL_R+9, 0, Math.PI*2);
  g.fillStyle = '#2a1708'; g.fill();
  g.strokeStyle = '#c89b4a'; g.lineWidth = 3; g.stroke();
  // rim lights
  for (let i = 0; i < 12; i++){
    const a = i/12*Math.PI*2 + now/600;
    const on = roul.spinning ? (i + Math.floor(now/90)) % 3 === 0 : (i + Math.floor(now/450)) % 4 === 0;
    g.beginPath();
    g.arc(Math.cos(a)*(WHEEL_R+9), Math.sin(a)*(WHEEL_R+9), 2.6, 0, Math.PI*2);
    g.fillStyle = on ? '#ffe27a' : '#5e3c14';
    g.fill();
  }
  // segments
  g.rotate(roul.angle);
  for (let i = 0; i < SEGS.length; i++){
    const m = SEGS[i];
    g.beginPath();
    g.moveTo(0,0);
    g.arc(0, 0, WHEEL_R, i*SEG_A, (i+1)*SEG_A);
    g.closePath();
    g.fillStyle = MULT_INFO[m].color;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1.2; g.stroke();
    g.save();
    g.rotate((i+0.5)*SEG_A);
    g.translate(WHEEL_R-22, 0);
    g.rotate(Math.PI/2);
    g.fillStyle = m >= 15 ? '#fff' : '#fff';
    g.font = `bold ${m>=10?15:14}px "Segoe UI", sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('×'+m, 0, 0);
    g.restore();
  }
  g.rotate(-roul.angle);
  // hub
  g.beginPath(); g.arc(0, 0, 30, 0, Math.PI*2);
  const hub = g.createRadialGradient(-6,-8,4, 0,0,30);
  hub.addColorStop(0,'#5e4520'); hub.addColorStop(1,'#241405');
  g.fillStyle = hub; g.fill();
  g.strokeStyle = '#c89b4a'; g.lineWidth = 2; g.stroke();
  g.fillStyle = mult ? '#ffd24a' : '#a78d62';
  g.font = 'bold 19px "Segoe UI", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(mult ? '×'+mult : '?', 0, 1);
  g.restore();
  // pointer
  g.beginPath();
  g.moveTo(WHEEL_X, WHEEL_Y - WHEEL_R + 12);
  g.lineTo(WHEEL_X-10, WHEEL_Y - WHEEL_R - 10);
  g.lineTo(WHEEL_X+10, WHEEL_Y - WHEEL_R - 10);
  g.closePath();
  g.fillStyle = '#ff4a3a'; g.fill();
  g.strokeStyle = '#7a1210'; g.lineWidth = 2; g.stroke();
}

function drawMarble(g, b){
  g.beginPath();
  g.ellipse(b.x+1.5, b.y+b.r*0.85, b.r*0.9, b.r*0.45, 0, 0, Math.PI*2);
  g.fillStyle = 'rgba(0,0,0,.3)'; g.fill();
  const grad = g.createRadialGradient(b.x-2.2, b.y-3, 0.8, b.x, b.y, b.r);
  grad.addColorStop(0,'#ffffff');
  grad.addColorStop(0.35, `hsl(${b.hue} 60% 72%)`);
  grad.addColorStop(1, `hsl(${b.hue} 65% 38%)`);
  g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI*2);
  g.fillStyle = grad; g.fill();
  g.save();
  g.beginPath(); g.arc(b.x, b.y, b.r-0.8, 0, Math.PI*2); g.clip();
  g.translate(b.x, b.y); g.rotate(b.rot);
  g.strokeStyle = `hsla(${(b.hue+150)%360} 80% 60% / .75)`;
  g.lineWidth = 1.8;
  g.beginPath(); g.arc(1.5, -0.8, b.r*0.45, 0.4, 3.6); g.stroke();
  g.restore();
  g.beginPath(); g.arc(b.x - b.r*0.35, b.y - b.r*0.4, b.r*0.26, 0, Math.PI*2);
  g.fillStyle = 'rgba(255,255,255,.85)'; g.fill();
}

function render(now){
  const g = cx2d;
  g.save();
  if (shake > 0) g.translate((Math.random()-0.5)*shake*9, (Math.random()-0.5)*shake*9);
  g.drawImage(bg, 0, 0);

  drawWheel(g, now);

  // state message
  g.textAlign = 'center';
  g.font = 'bold 17px "Malgun Gothic", sans-serif';
  g.strokeStyle = 'rgba(0,0,0,.65)'; g.lineWidth = 4;
  g.strokeText(stateMsg, (SLOT_L+SLOT_R)/2, 312);
  g.fillStyle = state === 'RESULT' ? '#ffd24a' : '#f5e9d3';
  g.fillText(stateMsg, (SLOT_L+SLOT_R)/2, 312);

  // lit LEDs + glowing pockets
  const blink = 0.62 + 0.38*Math.sin(now/170);
  for (const i of litSlots){
    const x = SLOT_L + SLOT_W*i;
    // pocket glow
    g.fillStyle = `rgba(255,40,30,${0.16*blink})`;
    g.fillRect(x+1.4, SLOT_TOP, SLOT_W-2.8, FLOOR_Y-SLOT_TOP);
    // LED
    const lx = x+SLOT_W/2;
    const halo = g.createRadialGradient(lx, LED_Y, 0.5, lx, LED_Y, 10);
    halo.addColorStop(0, `rgba(255,70,50,${blink})`);
    halo.addColorStop(1, 'rgba(255,70,50,0)');
    g.beginPath(); g.arc(lx, LED_Y, 10, 0, Math.PI*2);
    g.fillStyle = halo; g.fill();
    g.beginPath(); g.arc(lx, LED_Y, 3.4, 0, Math.PI*2);
    g.fillStyle = `rgba(255,${60+120*blink},40,1)`; g.fill();
  }

  // pin flashes
  for (const p of pins){
    if (p.f > 0.02){
      g.beginPath(); g.arc(p.x, p.y, p.r + 4.5*p.f, 0, Math.PI*2);
      g.fillStyle = `rgba(255,240,170,${p.f*0.8})`; g.fill();
    }
  }

  // plunger
  {
    const tip = plungerTipY();
    g.strokeStyle = '#9aa0a8'; g.lineWidth = 2.2;
    g.beginPath();
    const coils = 7, span = FLOOR_Y - tip - 6;
    for (let i = 0; i <= coils*8; i++){
      const t = i/(coils*8);
      const sx = PLUNGER_X + Math.sin(t*Math.PI*2*coils)*8;
      const sy = tip + 6 + t*span;
      i === 0 ? g.moveTo(sx, sy) : g.lineTo(sx, sy);
    }
    g.stroke();
    g.fillStyle = '#ff8a50';
    g.fillRect(PLUNGER_X-7, tip, 14, 6);
    g.beginPath(); g.arc(PLUNGER_X, tip+8, 6.5, 0, Math.PI*2);
    g.fillStyle = '#d4242a'; g.fill();
    g.strokeStyle = '#7a1216'; g.lineWidth = 1.5; g.stroke();
  }

  // power gauge
  if (charging){
    const gx = 551, gy = 850, gh = 280;
    g.fillStyle = 'rgba(0,0,0,.55)';
    g.fillRect(gx, gy-gh, 7, gh);
    const hue = 120 - power*120;
    g.fillStyle = `hsl(${hue} 90% 55%)`;
    g.fillRect(gx, gy - gh*power, 7, gh*power);
    g.strokeStyle = '#f3d9a4'; g.lineWidth = 1;
    g.strokeRect(gx, gy-gh, 7, gh);
  }

  // marbles
  for (const b of balls){
    if (b.state === 'live'){
      for (let i = 0; i < b.trail.length; i++){
        const tr = b.trail[i], a = (i+1)/b.trail.length;
        g.beginPath(); g.arc(tr.x, tr.y, b.r*a*0.7, 0, Math.PI*2);
        g.fillStyle = `hsla(${b.hue} 70% 70% / ${a*0.22})`; g.fill();
      }
    }
  }
  for (const b of balls){
    if (b.state === 'ready'){ b.x = PLUNGER_X; b.y = plungerTipY() - b.r; }
    drawMarble(g, b);
  }

  // shoot hint
  const cb = currentBall();
  if (state === 'SHOOT' && cb && cb.state === 'ready' && !charging){
    const a = 0.55 + 0.4*Math.sin(now/280);
    g.fillStyle = `rgba(255,230,150,${a})`;
    g.font = 'bold 14px "Malgun Gothic", sans-serif';
    g.textAlign = 'center';
    g.fillText('꾹 눌러 발사! →', 440, 742);
  }

  // god rays from the winning hole (big wins)
  if (rays){
    const rp = rays.t / rays.dur;
    const a = (1 - rp) * 0.45;
    const n = 14 + rays.tier*3;
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.translate(rays.x, rays.y);
    g.rotate(rays.t * 0.4);
    for (let i = 0; i < n; i++){
      g.rotate(Math.PI*2/n);
      const grad = g.createLinearGradient(0, 0, 0, -1000);
      grad.addColorStop(0, `rgba(255,228,130,${a})`);
      grad.addColorStop(1, 'rgba(255,228,130,0)');
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(-10,0); g.lineTo(10,0); g.lineTo(30,-1000); g.lineTo(-30,-1000);
      g.closePath(); g.fill();
    }
    g.restore();
  }
  // rainbow strobe wash (top tiers)
  if (rainbow > 0){
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = `hsla(${(now/4)%360} 90% 60% / ${0.13*rainbow})`;
    g.fillRect(0, 0, W, H);
    g.restore();
  }

  // payout particles (marble fountain + sparkles)
  for (const p of particles){
    if (p.delay > 0) continue;
    const a = Math.max(0, Math.min(1, p.t / 0.5));
    if (p.spark){
      g.globalAlpha = a;
      const halo = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*3);
      halo.addColorStop(0, '#fff6d0'); halo.addColorStop(0.4, '#ffd24a'); halo.addColorStop(1, 'rgba(255,210,74,0)');
      g.beginPath(); g.arc(p.x, p.y, p.r*3, 0, Math.PI*2);
      g.fillStyle = halo; g.fill();
    } else {
      g.globalAlpha = a;
      const grad = g.createRadialGradient(p.x-p.r*0.3, p.y-p.r*0.4, 0.4, p.x, p.y, p.r);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.4, `hsl(${p.hue} 65% 70%)`);
      grad.addColorStop(1, `hsl(${p.hue} 65% 40%)`);
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI*2);
      g.fillStyle = grad; g.fill();
    }
  }
  g.globalAlpha = 1;

  // shock rings
  for (const r of rings){
    if (r.t < 0) continue;
    const rp = r.t / r.dur, a = 1 - rp;
    g.beginPath(); g.arc(r.x, r.y, r.r, 0, Math.PI*2);
    g.strokeStyle = `rgba(${r.color},${a*0.85})`;
    g.lineWidth = r.lw * (1 - rp*0.6);
    g.stroke();
  }
  // confetti
  for (const c of confetti){
    const a = Math.min(1, (c.dur - c.t)/0.6);
    g.save();
    g.globalAlpha = Math.max(0, a);
    g.translate(c.x, c.y); g.rotate(c.rot);
    g.fillStyle = `hsl(${c.hue} 85% 60%)`;
    if (c.shape === 'strip') g.fillRect(-c.w/2, -c.h/2, c.w*0.5, c.h);
    else g.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    g.restore();
  }
  g.globalAlpha = 1;

  // popups
  g.textAlign = 'center';
  for (const pp of popups){
    g.globalAlpha = Math.min(1, pp.t);
    g.font = `bold ${pp.size}px "Segoe UI", sans-serif`;
    g.strokeStyle = 'rgba(0,0,0,.7)'; g.lineWidth = 3.5;
    g.strokeText(pp.txt, pp.x, pp.y);
    g.fillStyle = pp.color;
    g.fillText(pp.txt, pp.x, pp.y);
  }
  g.globalAlpha = 1;

  // win banner — bigger win, bigger pop
  if (banner){
    const p = banner.t / banner.dur;
    const grow = Math.min(1, banner.t / 0.22);
    const k = grow - 1;
    const scale = 1 + 2.7*k*k*k + 1.7*k*k;          // ease-out-back pop
    const alpha = p > 0.72 ? 1 - (p - 0.72)/0.28 : 1;
    g.save();
    g.globalAlpha = alpha;
    g.translate((SLOT_L+SLOT_R)/2, 470);
    g.scale(scale, scale);
    g.textAlign = 'center';
    if (banner.tier >= 2){
      g.shadowColor = banner.tier === 3 ? '#ffae00' : '#ffd24a';
      g.shadowBlur = 14 + banner.tier*8;
    }
    g.font = `bold ${Math.min(15 + banner.tier*3, 30)}px "Malgun Gothic", sans-serif`;
    g.strokeStyle = 'rgba(0,0,0,.75)'; g.lineWidth = 5;
    g.strokeText(banner.sub, 0, -38);
    g.fillStyle = banner.tier >= 5 ? '#ffae00' : '#ffd24a';
    g.fillText(banner.sub, 0, -38);
    g.font = `bold ${Math.min(32 + banner.tier*9, 70)}px "Segoe UI", sans-serif`;
    g.strokeStyle = 'rgba(0,0,0,.78)'; g.lineWidth = 7;
    g.strokeText(banner.txt, 0, 16);
    let tg;
    if (banner.tier >= 6){                       // rainbow shimmer for the top tiers
      tg = g.createLinearGradient(-130, 0, 130, 0);
      for (let s = 0; s <= 6; s++) tg.addColorStop(s/6, `hsl(${(now/3 + s*55)%360} 90% 62%)`);
    } else {
      tg = g.createLinearGradient(0, -22, 0, 22);
      tg.addColorStop(0, '#fff6d0'); tg.addColorStop(0.5, '#ffd24a'); tg.addColorStop(1, '#e8930c');
    }
    g.fillStyle = tg;
    g.fillText(banner.txt, 0, 16);
    g.restore();
  }

  // gold flash on wins (stronger for bigger payouts)
  if (flash > 0){
    g.fillStyle = `rgba(255,222,120,${Math.min(0.6, flash*0.5)})`;
    g.fillRect(0, 0, W, H);
  }

  // neon border glow during big celebrations
  if (borderGlow > 0){
    g.save();
    g.strokeStyle = rainbow > 0
      ? `hsla(${(now/4)%360} 90% 60% / ${borderGlow})`
      : `rgba(255,210,90,${borderGlow})`;
    g.lineWidth = 9;
    g.shadowColor = g.strokeStyle; g.shadowBlur = 38;
    g.strokeRect(5, 5, W-10, H-10);
    g.lineWidth = 3;
    g.strokeRect(5, 5, W-10, H-10);
    g.restore();
  }

  // theme level-up announcement
  if (themeFx){
    const p = themeFx.t / themeFx.dur;
    const grow = Math.min(1, themeFx.t / 0.3);
    const k = grow - 1;
    const scale = 1 + 2.2*k*k*k + 1.4*k*k;
    const alpha = p > 0.78 ? 1 - (p - 0.78)/0.22 : 1;
    g.save();
    g.globalAlpha = alpha;
    g.translate(W/2, 430);
    g.scale(scale, scale);
    g.textAlign = 'center';
    g.font = 'bold 15px "Malgun Gothic", sans-serif';
    g.fillStyle = '#fff6d0';
    g.strokeStyle = 'rgba(0,0,0,.7)'; g.lineWidth = 4;
    g.strokeText('새로운 무대 도착!', 0, -30);
    g.fillText('새로운 무대 도착!', 0, -30);
    g.shadowColor = '#ffd24a'; g.shadowBlur = 18;
    g.font = 'bold 34px "Malgun Gothic", sans-serif';
    g.strokeStyle = 'rgba(0,0,0,.75)'; g.lineWidth = 6;
    g.strokeText(themeFx.name, 0, 12);
    g.fillStyle = '#ffd24a';
    g.fillText(themeFx.name, 0, 12);
    g.restore();
  }
  g.restore();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const SUBSTEPS = 8;
let lastT = 0;
function frame(t){
  const dt = Math.min((t - lastT)/1000, 0.022);
  lastT = t;

  // roulette
  if (roul.spinning){
    roul.t += dt;
    const p = Math.min(1, roul.t / roul.dur);
    roul.angle = roul.from + roul.total * (1 - Math.pow(1-p, 3));
    const seg = segUnderPointer();
    if (seg !== roul.lastSeg){ sndTick(); roul.lastSeg = seg; }
    if (p >= 1){ roul.spinning = false; onSpinEnd(); }
  } else if (state === 'BET'){
    roul.angle += dt * 0.25;     // idle drift
  }

  if (state !== 'OVER'){
    if (charging){
      power = Math.min(1, power + dt*0.72);
      if (power - lastTickPower > 0.07 && power < 1){
        sndRatchet(); lastTickPower = power;
      }
    }
    const sub = dt / SUBSTEPS;
    for (let s = 0; s < SUBSTEPS; s++)
      for (const b of balls) stepBall(b, sub);

    const cb = currentBall();
    if (cb && cb.state === 'live'){
      cb.trail.push({ x:cb.x, y:cb.y });
      if (cb.trail.length > 11) cb.trail.shift();
    }
  }

  plungerAnim = Math.max(0, plungerAnim - dt*6);
  shake = Math.max(0, shake - dt*2.2);
  flash = Math.max(0, flash - dt*1.6);
  if (banner){
    banner.t += dt;
    if (banner.t >= banner.dur) banner = null;
  }
  if (themeFx){
    themeFx.t += dt;
    if (themeFx.t >= themeFx.dur) themeFx = null;
  }
  for (let i = particles.length-1; i >= 0; i--){
    const p = particles[i];
    if (p.delay > 0){ p.delay -= dt; continue; }
    p.vy += (p.spark ? 600 : 1400) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (!p.spark && p.y + p.r > FLOOR_Y - 2 && p.vy > 0){   // bounce in the tray
      p.y = FLOOR_Y - 2 - p.r; p.vy *= -0.45; p.vx *= 0.85;
    }
    p.t -= dt;
    if (p.t <= 0 || p.y > H + 40) particles.splice(i, 1);
  }
  for (const p of pins) p.f = Math.max(0, p.f - dt*4);
  for (let i = popups.length-1; i >= 0; i--){
    popups[i].t -= dt; popups[i].y -= dt*34;
    if (popups[i].t <= 0) popups.splice(i, 1);
  }
  // --- celebration effects ---
  borderGlow = Math.max(0, borderGlow - dt*0.55);
  rainbow = Math.max(0, rainbow - dt*0.4);
  if (rays){ rays.t += dt; if (rays.t >= rays.dur) rays = null; }
  for (let i = rings.length-1; i >= 0; i--){
    const r = rings[i];
    r.t += dt;
    if (r.t < 0) continue;
    const p = r.t / r.dur;
    r.r = r.r + (r.maxR - r.r) * Math.min(1, dt*8);
    if (p >= 1) rings.splice(i, 1);
  }
  for (let i = confetti.length-1; i >= 0; i--){
    const c = confetti[i];
    c.t += dt;
    c.vy += 60*dt; c.vx *= 0.99;
    c.x += c.vx*dt; c.y += c.vy*dt; c.rot += c.vr*dt;
    if (c.t >= c.dur || c.y > H+30) confetti.splice(i, 1);
  }
  for (let i = fireworks.length-1; i >= 0; i--){
    fireworks[i].delay -= dt;
    if (fireworks[i].delay <= 0){
      const f = fireworks[i];
      fireBurst(f.x, f.y, f.hue, f.n);
      fireworks.splice(i, 1);
    }
  }

  updateRollSound();
  render(t);
  requestAnimationFrame(frame);
}

/* ============================================================
   ONLINE LEADERBOARD — Firebase Realtime Database
   /scores/{nickKey} = { name, score, ts } ; keep-highest enforced
   both in DB rules and client transaction. Live via .on('value').
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCmVr9hbRDzDUXK6R2SH-YmsikrBSt0m-0",
  authDomain: "taiwan-pinball-12pin.firebaseapp.com",
  databaseURL: "https://taiwan-pinball-12pin-default-rtdb.firebaseio.com",
  projectId: "taiwan-pinball-12pin",
  storageBucket: "taiwan-pinball-12pin.firebasestorage.app",
  messagingSenderId: "746674691306",
  appId: "1:746674691306:web:f0c9eedf4cd42fb6a58b93"
};
let lbDB = null;
const LB_ON = !!(window.firebase && firebaseConfig.databaseURL);

function myNick(){ return localStorage.getItem('tw-pinball-nick') || ''; }
function nickKey(name){ return name.replace(/[.#$\[\]\/]/g, '_'); }

const HOF_MIN = 1000000000000;   // 1조 — threshold to enter the Hall of Fame

function renderHOF(rows){
  const ol = document.getElementById('hofList');
  if (!ol) return;
  ol.innerHTML = '';
  const me = myNick();
  rows.forEach((row, i) => {
    const li = document.createElement('li');
    const crown = i===0 ? '👑' : `${i+1}.`;
    const nm = document.createElement('span');
    nm.className = 'lbName'; nm.textContent = `${crown} ${row.name}`;
    const sc = document.createElement('span');
    sc.className = 'lbScore'; sc.textContent = (+row.score).toLocaleString();
    li.appendChild(nm); li.appendChild(sc);
    if (me && row.name === me) li.classList.add('mine');
    ol.appendChild(li);
  });
  if (!rows.length){
    const li = document.createElement('li');
    li.className = 'hofEmpty';
    li.textContent = '아직 아무도 兆(조)를 넘지 못했습니다…';
    ol.appendChild(li);
  }
}
// engrave into the Hall of Fame (keep-highest). returns 'ok' | 'lower' | 'fail'
async function writeHOF(name, score){
  if (!lbDB || score < HOF_MIN) return 'fail';
  try {
    const ref = lbDB.ref('halloffame/' + nickKey(name));
    const res = await ref.transaction(cur => {
      if (cur && cur.score >= score) return;
      return { name, score, ts: firebase.database.ServerValue.TIMESTAMP };
    });
    return res.committed ? 'ok' : 'lower';
  } catch(e){ return 'fail'; }
}
function updateHofUI(){
  const btn = document.getElementById('ovHof');
  if (btn) btn.style.display = (LB_ON && best >= HOF_MIN) ? 'block' : 'none';
}

function renderLB(rows){
  const ol = document.getElementById('lbList');
  ol.innerHTML = '';
  const me = myNick();
  rows.forEach((row, i) => {
    const li = document.createElement('li');
    const medal = i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : `${i+1}.`;
    const nm = document.createElement('span');
    nm.className = 'lbName'; nm.textContent = `${medal} ${row.name}`;
    const sc = document.createElement('span');
    sc.className = 'lbScore'; sc.textContent = (+row.score).toLocaleString();
    li.appendChild(nm); li.appendChild(sc);
    if (me && row.name === me) li.classList.add('mine');
    ol.appendChild(li);
  });
  if (!rows.length){
    const li = document.createElement('li');
    li.textContent = '아직 기록이 없어요 — 1등을 차지하세요!';
    ol.appendChild(li);
  }
}
async function lbSubmit(rawName, score, msgEl){
  if (!LB_ON || !lbDB){ msgEl.textContent = '랭킹 서버 연결 대기 중...'; return; }
  const name = (rawName || '').trim().slice(0, 12);
  if (!name){ msgEl.textContent = '닉네임을 입력하세요'; return; }
  if (!/^[가-힣ㄱ-ㅎa-zA-Z0-9 _\-]{1,12}$/.test(name)){
    msgEl.textContent = '닉네임은 한글/영문/숫자/공백/-_만 가능해요'; return;
  }
  if (!(score > 0)){ msgEl.textContent = '아직 등록할 기록이 없어요'; return; }
  localStorage.setItem('tw-pinball-nick', name);
  document.getElementById('nick').value = name;
  document.getElementById('ovNick').value = name;
  msgEl.textContent = '등록 중...';
  try {
    const ref = lbDB.ref('scores/' + nickKey(name));
    const res = await ref.transaction(cur => {
      if (cur && cur.score >= score) return;        // keep highest — abort
      return { name, score, ts: firebase.database.ServerValue.TIMESTAMP };
    });
    if (res.committed){
      msgEl.textContent = '✅ 랭킹 등록 완료!';
      blip('triangle', 880, 0.2, 0.2, 880);
      blip('triangle', 1175, 0.3, 0.2, 1175, 0, 0.12);
    } else {
      msgEl.textContent = '이미 더 높은 기록이 등록돼 있어요';
    }
    if (score >= HOF_MIN){                       // 조 돌파 → 명예의 전당 자동 등재
      const hof = await writeHOF(name, score);
      if (hof === 'ok'){
        msgEl.textContent = '🏛️ 명예의 전당 등재 완료!';
        [523,659,784,1047,1319,1568].forEach((f,i)=> blip('triangle', f, 0.3, 0.2, f, i*0.09));
      }
    }
  } catch(e){ msgEl.textContent = '등록 실패 — 다시 시도해주세요'; }
}
function lbInit(){
  document.getElementById('nick').value = myNick();
  document.getElementById('ovNick').value = myNick();
  document.getElementById('lbSend').addEventListener('click', () =>
    lbSubmit(document.getElementById('nick').value, best, document.getElementById('lbMsg')));
  document.getElementById('ovSend').addEventListener('click', () =>
    lbSubmit(document.getElementById('ovNick').value, best, document.getElementById('ovMsg')));
  [['nick','lbMsg'],['ovNick','ovMsg']].forEach(([inp,msg]) =>
    document.getElementById(inp).addEventListener('keydown', e => {
      if (e.key === 'Enter') lbSubmit(document.getElementById(inp).value, best, document.getElementById(msg));
    }));
  // explicit "명예의 전당 등재" button on the game-over screen
  document.getElementById('ovHof').addEventListener('click', async () => {
    const msgEl = document.getElementById('ovHofMsg');
    if (best < HOF_MIN){ msgEl.textContent = '兆(1조)를 넘어야 도전할 수 있어요'; return; }
    const name = (document.getElementById('ovNick').value || myNick()).trim().slice(0,12);
    if (!/^[가-힣ㄱ-ㅎa-zA-Z0-9 _\-]{1,12}$/.test(name)){ msgEl.textContent = '닉네임을 먼저 입력하세요'; return; }
    localStorage.setItem('tw-pinball-nick', name);
    msgEl.textContent = '새기는 중...';
    const r = await writeHOF(name, best);
    if (r === 'ok'){
      msgEl.textContent = '🏛️ 명예의 전당에 이름이 새겨졌습니다!';
      [523,659,784,1047,1319,1568,2093].forEach((f,i)=> blip('triangle', f, 0.32, 0.22, f, i*0.09));
    } else if (r === 'lower'){ msgEl.textContent = '이미 더 높은 기록으로 등재돼 있어요';
    } else { msgEl.textContent = '등재 실패 — 다시 시도해주세요'; }
  });

  if (!LB_ON){
    document.getElementById('lbStatus').textContent = '⏳ 랭킹 서버 연결 준비 중...';
    return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    lbDB = firebase.database();
    // live TOP 20 — pushed automatically on any change
    lbDB.ref('scores').orderByChild('score').limitToLast(20).on('value', snap => {
      const rows = [];
      snap.forEach(c => { rows.push(c.val()); });
      rows.sort((a,b) => b.score - a.score);
      renderLB(rows);
      document.getElementById('lbStatus').textContent = '🟢 실시간 연결됨';
    }, err => {
      document.getElementById('lbStatus').textContent = '연결 실패 — 새로고침 해주세요';
    });
    // live Hall of Fame (兆 club)
    lbDB.ref('halloffame').orderByChild('score').limitToLast(20).on('value', snap => {
      const rows = [];
      snap.forEach(c => { rows.push(c.val()); });
      rows.sort((a,b) => b.score - a.score);
      renderHOF(rows);
    });
  } catch(e){
    document.getElementById('lbStatus').textContent = '랭킹 초기화 오류';
  }
}

lbInit();
resetGame();
requestAnimationFrame(frame);
</script>
