<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>台灣彈珠台 — 대만 핀볼</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 20%, #2a2433 0%, #161219 70%);
    color:#f5e9d3; font-family:'Segoe UI', 'Malgun Gothic', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  header { display:flex; align-items:center; gap:22px; padding:8px 0 4px; flex-wrap:wrap; justify-content:center; }
  h1 { font-size:24px; color:#ffd24a; text-shadow:0 0 14px rgba(255,180,40,.45); letter-spacing:2px; }
  h1 span { font-size:12px; color:#e8c89a; letter-spacing:4px; margin-left:8px; }
  #hud { display:flex; gap:14px; }
  .stat { background:rgba(0,0,0,.4); border:1px solid #5a4632; border-radius:10px; padding:3px 14px; text-align:center; min-width:96px; }
  .stat label { font-size:10px; color:#bca06f; letter-spacing:2px; }
  .stat > div { font-size:19px; font-weight:bold; color:#ffe9b0; font-variant-numeric:tabular-nums; }
  #marbles { color:#8fe3ff !important; }
  #stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas {
    height:100%; max-height:920px; aspect-ratio:560/920; width:auto;
    border-radius:14px; box-shadow:0 10px 50px rgba(0,0,0,.7), 0 0 0 4px #1c1410, 0 0 0 6px #6b4a26;
    touch-action:none; cursor:pointer;
  }
  #betbar { display:flex; align-items:center; gap:8px; padding:8px 0 2px; }
  #betbar button {
    font-size:15px; font-weight:bold; border:none; border-radius:8px; cursor:pointer;
    padding:8px 13px; background:#3b2c1c; color:#ffe9b0; border:1px solid #6b4a26;
    transition:transform .06s, background .15s;
  }
  #betbar button:hover:not(:disabled) { background:#54401f; }
  #betbar button:active:not(:disabled) { transform:scale(.93); }
  #betbar button:disabled { opacity:.35; cursor:default; }
  #betAmt {
    min-width:86px; text-align:center; font-size:20px; font-weight:bold; color:#8fe3ff;
    background:rgba(0,0,0,.5); border:1px solid #4a6a7a; border-radius:8px; padding:6px 10px;
    font-variant-numeric:tabular-nums;
  }
  #insert {
    background:linear-gradient(180deg,#ffd56b,#e09a2d) !important; color:#3a2305 !important;
    font-size:16px !important; padding:9px 22px !important;
    box-shadow:0 3px 0 #8a5d14; border:none !important;
  }
  #insert:disabled { box-shadow:none; }
  #hint { font-size:12px; color:#a78d62; padding:4px 0 10px; text-align:center; line-height:1.5; }
  #hint b { color:#e85d5d; }
  #overlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(10,6,4,.8); border-radius:14px; backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .5s;
  }
  #overlay.show { opacity:1; pointer-events:auto; }
  #panel { text-align:center; padding:32px 48px; background:linear-gradient(170deg,#3b2a18,#241708); border:3px solid #c89b4a; border-radius:18px; box-shadow:0 0 40px rgba(255,190,80,.25); }
  #panel h2 { color:#ffd24a; font-size:28px; margin-bottom:10px; text-shadow:0 0 12px rgba(255,180,40,.6); }
  #ovStats { font-size:15px; color:#e8c89a; margin-bottom:18px; line-height:1.8; }
  #ovStats b { color:#fff3d0; font-size:19px; }
  #restart {
    font-size:18px; font-weight:bold; padding:12px 38px; border-radius:30px; border:none; cursor:pointer;
    background:linear-gradient(180deg,#ffd56b,#e09a2d); color:#3a2305;
    box-shadow:0 4px 0 #8a5d14, 0 8px 18px rgba(0,0,0,.5); transition:transform .08s;
  }
  #restart:active { transform:translateY(3px); box-shadow:0 1px 0 #8a5d14; }
</style>
</head>
<body>
<header>
  <h1>台灣彈珠台<span>대 만 핀 볼</span></h1>
  <div id="hud">
    <div class="stat"><label>보유 구슬</label><div id="marbles">100</div></div>
    <div class="stat"><label>최고 기록</label><div id="best">0</div></div>
    <div class="stat"><label>판 수</label><div id="rounds">0</div></div>
  </div>
</header>
<div id="stage">
  <canvas id="game" width="560" height="920"></canvas>
  <div id="overlay">
    <div id="panel">
      <h2 id="ovTitle">게임 종료</h2>
      <div id="ovStats"></div>
      <button id="restart">🔄 구슬 100개로 다시 시작</button>
    </div>
  </div>
</div>
<div id="betbar">
  <button data-d="-10">−10</button>
  <button data-d="-1">−1</button>
  <div id="betAmt">10</div>
  <button data-d="1">+1</button>
  <button data-d="10">+10</button>
  <button id="betMax">MAX</button>
  <button id="insert">🎱 구슬 투입</button>
</div>
<p id="hint">
  구슬을 투입하면 룰렛이 배율을 정하고, <b>빨간 LED</b>가 켜진 구멍에 넣으면 <b>배팅 × 배율</b>만큼 받아요! (빗나가면 몰수)<br>
  배율별 LED 구멍 수 — ×2→7칸 · ×4→5칸 · ×5→5칸 · ×8→4칸 · ×10→3칸 · ×15→2칸 · ×20→1칸 · 🏆 무한 플레이! 최고 기록에 도전하세요
</p>

<script>
'use strict';
/* ============================================================
   台灣彈珠台 — Taiwanese betting pinball machine
   bet marbles → roulette picks multiplier → red-LED holes →
   one shot: lit hole = bet × multiplier, miss = lose the bet
   ============================================================ */
const cv = document.getElementById('game');
const cx2d = cv.getContext('2d');
const W = 560, H = 920;

/* ---------- board geometry ---------- */
const WALL    = 12;
const ARC_CY  = 280;             // top dome centre y
const ARC_R   = W/2 - WALL;      // 268
const LANE_X  = 500;             // launch-lane wall centre x
const LANE_W  = 4;
const LANE_TOP= 292;
const FLOOR_Y = 908;
const BALL_R  = 6.5;
const PLUNGER_X = 524;

const SLOT_N  = 30;
const SLOT_L  = WALL, SLOT_R = LANE_X - LANE_W;     // 12 .. 496
const SLOT_W  = (SLOT_R - SLOT_L) / SLOT_N;         // ≈16.1
const SLOT_TOP = 760;
const LED_Y   = 750;

const GRAVITY = 1700;
const START_MARBLES = 100;

/* multiplier → number of lit holes (higher = harder) */
const MULT_INFO = {
  2:{n:7,color:'#4a7fc1'}, 4:{n:5,color:'#3fa05a'}, 5:{n:5,color:'#2aa198'},
  8:{n:4,color:'#d07a2a'}, 10:{n:3,color:'#9b59b6'}, 15:{n:2,color:'#d4242a'},
  20:{n:1,color:'#d4af37'},
};
/* roulette wheel: 16 weighted segments */
const SEGS = [2,4,5,2,8,4,10,2,15,5,4,2,8,20,5,2];
const SEG_A = Math.PI*2 / SEGS.length;

/* ---------- nail pins ---------- */
const pins = [];
for (let row = 0; row < 12; row++){
  const y = 330 + row * 34;
  const offset = (row % 2) ? 18 : 0;
  for (let x = 30 + offset; x <= 470; x += 36)
    pins.push({ x, y, r:3.5, f:0 });
}
/* ---------- slot dividers ---------- */
const dividers = [];
for (let i = 1; i < SLOT_N; i++)
  dividers.push({ x: SLOT_L + SLOT_W*i, y1: SLOT_TOP, y2: FLOOR_Y });

/* ---------- game state ---------- */
let state = 'BET';               // BET → SPIN → SHOOT → RESULT → OVER
let marbles = START_MARBLES;
let bet = 10;
let mult = 0;
let litSlots = [];               // revealed LEDs (grows during reveal)
let litChosen = [];              // full chosen set
let rounds = 0;
let best = +(localStorage.getItem('tw-pinball-best') || 0);
let gen = 0;                     // generation guard for timeouts
let balls = [];
let charging = false, power = 0, lastTickPower = 0, plungerAnim = 0;
let popups = [], shake = 0;
let particles = [];          // payout marble fountain + sparkles
let flash = 0;               // gold screen flash on big wins
let banner = null;           // {txt, sub, t, dur, tier}
let stateMsg = '';

const roul = { angle: 0, spinning:false, t:0, dur:3, from:0, total:0, lastSeg:-1, resultMult:0 };

function safeTimeout(fn, ms){
  const g = gen;
  setTimeout(()=>{ if (g === gen) fn(); }, ms);
}

function newBall(){
  return {
    x: PLUNGER_X, y: 0, vx:0, vy:0, r: BALL_R,
    state:'ready', launched:false, contact:false, settle:0, slow:0,
    rot:0, hue: 170 + Math.random()*160, trail:[],
  };
}
function currentBall(){ return balls.find(b => b.state !== 'done'); }

function updateHUD(){
  document.getElementById('marbles').textContent = marbles.toLocaleString();
  document.getElementById('best').textContent = Math.max(best, marbles).toLocaleString();
  document.getElementById('rounds').textContent = rounds;
  bet = Math.max(1, Math.min(bet, Math.max(1, marbles)));
  document.getElementById('betAmt').textContent = bet + '개';
  const canBet = state === 'BET' && marbles > 0;
  document.querySelectorAll('#betbar button').forEach(b => b.disabled = !canBet);
}

/* ============================================================
   AUDIO — synthesized with Web Audio
   ============================================================ */
let AC = null, rollGain = null, rollFilter = null, master = null;
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
  const len = AC.sampleRate;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  rollFilter = AC.createBiquadFilter();
  rollFilter.type = 'bandpass'; rollFilter.frequency.value = 460; rollFilter.Q.value = 0.8;
  rollGain = AC.createGain(); rollGain.gain.value = 0;
  src.connect(rollFilter); rollFilter.connect(rollGain); rollGain.connect(master);
  src.start();
}
function blip(type, freq, dur, vol, freqEnd, when=0){
  if (!AC) return;
  const t0 = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0+dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
}
function noiseBurst(dur, vol, freq, when=0){
  if (!AC) return;
  const t0 = AC.currentTime + when;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t0);
}
let lastPing = 0;
function sndPin(impact){
  const now = performance.now();
  if (now - lastPing < 26) return;
  lastPing = now;
  const v = Math.min(1, impact/900);
  blip('triangle', 1600 + Math.random()*900 + v*500, 0.05+v*0.05, 0.04 + v*0.2, 850);
  blip('sine', 3300 + Math.random()*1200, 0.035, v*0.07, 2100);
}
function sndWall(impact){
  const v = Math.min(1, impact/1000);
  if (v < 0.12) return;
  noiseBurst(0.05, v*0.22, 500);
  blip('sine', 150, 0.07, v*0.28, 65);
}
function sndClack(when=0, vol=0.2){             // marble clack (insert / payout)
  noiseBurst(0.025, vol, 1600, when);
  blip('sine', 800 + Math.random()*500, 0.03, vol*0.7, 500, when);
}
function sndInsert(n){
  const k = Math.min(n, 12);
  for (let i = 0; i < k; i++) sndClack(i*0.045, 0.18);
}
function sndTick(){ blip('square', 1300, 0.025, 0.07, 900); }
function sndMultStop(m){
  blip('triangle', 660, 0.15, 0.25, 660);
  blip('triangle', 880, 0.25, 0.25, 880, 0, 0.1);
  if (m >= 10) blip('triangle', 1320, 0.3, 0.22, 1320, 0, 0.2);
}
function sndLed(i){ blip('square', 900 + i*90, 0.07, 0.12, 880 + i*90); }
function sndRatchet(){
  noiseBurst(0.02, 0.12, 2500);
  blip('square', 220 + power*260, 0.025, 0.05, 140);
}
function sndLaunch(p){
  noiseBurst(0.08, 0.3, 1800);
  blip('triangle', 110 + p*90, 0.22, 0.35, 50);
  blip('sine', 300 + p*250, 0.1, 0.2, 90);
}
function sndWin(payout, m){
  const notes = m >= 15 ? [523,659,784,1047,1319,1568,2093]
              : m >= 8  ? [523,659,784,1047,1319]
              :           [523,659,784,1047];
  notes.forEach((f,i)=>{ blip('triangle', f, 0.3, 0.24, f, i*0.09); blip('sine', f*2, 0.22, 0.09, f*2, i*0.09); });
  const k = Math.min(payout, 28);                // marbles pouring out
  for (let i = 0; i < k; i++) sndClack(0.35 + i*0.05 + Math.random()*0.02, 0.16);
}
function sndMiss(){
  blip('triangle', 392, 0.2, 0.22, 392);
  blip('triangle', 311, 0.2, 0.22, 311, 0, 0.16);
  blip('triangle', 233, 0.4, 0.22, 180, 0, 0.32);
}
function updateRollSound(){
  if (!AC || !rollGain) return;
  let target = 0, freq = 460;
  const b = currentBall();
  if (b && b.state === 'live' && b.contact){
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 25){
      target = Math.min(0.15, sp/6000);
      freq = 320 + Math.min(900, sp*0.4);
    }
  }
  rollGain.gain.setTargetAtTime(target, AC.currentTime, 0.06);
  rollFilter.frequency.setTargetAtTime(freq, AC.currentTime, 0.08);
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function doInsert(){
  initAudio();
  if (state !== 'BET' || marbles <= 0) return;
  bet = Math.max(1, Math.min(bet, marbles));
  marbles -= bet;
  rounds++;
  sndInsert(bet);
  state = 'SPIN';
  stateMsg = '🎰 룰렛 회전 중...';
  startSpin();
  updateHUD();
}
function startSpin(){
  const tIdx = Math.floor(Math.random() * SEGS.length);
  roul.resultMult = SEGS[tIdx];
  // final angle puts target segment centre under the top pointer
  const desired = -Math.PI/2 - (tIdx + 0.5)*SEG_A + (Math.random()-0.5)*SEG_A*0.6;
  const delta = ((desired - roul.angle) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  roul.from = roul.angle;
  roul.total = Math.PI*8 + delta;
  roul.t = 0; roul.dur = 2.8 + Math.random()*0.5;
  roul.spinning = true;
  roul.lastSeg = segUnderPointer();
}
function segUnderPointer(){
  const rel = ((-Math.PI/2 - roul.angle) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  return Math.floor(rel / SEG_A) % SEGS.length;
}
function onSpinEnd(){
  mult = roul.resultMult;
  const info = MULT_INFO[mult];
  sndMultStop(mult);
  stateMsg = `×${mult} 당첨! LED 구멍 ${info.n}개 점등 중...`;
  // pick lit holes
  const idxs = Array.from({length:SLOT_N}, (_,i)=>i);
  for (let i = idxs.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
  }
  litChosen = idxs.slice(0, info.n).sort((a,b)=>a-b);
  litSlots = [];
  litChosen.forEach((slot, i)=>{
    safeTimeout(()=>{ litSlots.push(slot); sndLed(i); }, 500 + i*180);
  });
  safeTimeout(()=>{
    state = 'SHOOT';
    stateMsg = `×${mult} — 빨간 LED 구멍을 노려라! (배팅 ${bet}개)`;
    balls.push(newBall());
    updateHUD();
  }, 500 + litChosen.length*180 + 350);
}
function spawnPayout(idx, payout, tier){
  const hx = SLOT_L + SLOT_W*(idx+0.5);
  // marble fountain bursting out of the winning hole
  const count = Math.min(12 + Math.floor(payout*0.8), 90);
  for (let i = 0; i < count; i++){
    particles.push({
      x: hx + (Math.random()-0.5)*8, y: FLOOR_Y - 10,
      vx: (Math.random()-0.5)*(320 + tier*120),
      vy: -(380 + Math.random()*480 + tier*140),
      r: 3.2 + Math.random()*2.6,
      hue: Math.random()*360, t: 2.2,
      delay: i * 0.016, spark: false,
    });
  }
  // gold sparkles for big wins
  if (tier >= 2){
    for (let i = 0; i < tier*22; i++){
      const a = Math.random()*Math.PI*2, sp = 120 + Math.random()*420;
      particles.push({
        x: hx, y: FLOOR_Y - 40,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 250,
        r: 1.5 + Math.random()*2.2,
        hue: 45, t: 0.9 + Math.random()*0.7,
        delay: Math.random()*0.25, spark: true,
      });
    }
  }
}
function resolveRound(b){
  b.state = 'done'; b.vx = b.vy = 0;
  const idx = Math.max(0, Math.min(SLOT_N-1, Math.floor((b.x - SLOT_L) / SLOT_W)));
  const hit = litChosen.includes(idx);
  state = 'RESULT';
  if (hit){
    const payout = bet * mult;
    marbles += payout;
    sndWin(payout, mult);
    // impact scales with how much you won
    const tier = payout >= 400 ? 3 : payout >= 120 ? 2 : 1;
    shake = 0.4 + tier*0.5;
    flash = 0.35 + tier*0.22;
    spawnPayout(idx, payout, tier);
    banner = {
      txt: `+${payout.toLocaleString()}`,
      sub: tier === 3 ? '💰 MEGA WIN!! 💰' : tier === 2 ? '✨ BIG WIN! ✨' : '🎉 당첨!',
      t: 0, dur: 1.3 + tier*0.35, tier,
    };
    stateMsg = `🎉 성공!! +${payout.toLocaleString()}개 지급!`;
    popups.push({ x: SLOT_L + SLOT_W*(idx+0.5), y: 740, txt:`+${payout.toLocaleString()}`,
                  t:1.8, color:'#ffd24a', size:26 });
  } else {
    sndMiss();
    stateMsg = `😵 꽝... 배팅한 ${bet}개를 잃었어요`;
    popups.push({ x: SLOT_L + SLOT_W*(idx+0.5), y: 740, txt:'꽝', t:1.4, color:'#ff8a8a', size:20 });
  }
  if (marbles > best){ best = marbles; localStorage.setItem('tw-pinball-best', best); }
  updateHUD();
  safeTimeout(()=>{
    balls = balls.filter(x => x.state !== 'done');
    litSlots = []; litChosen = []; mult = 0;
    if (marbles <= 0) endGame();
    else { state = 'BET'; stateMsg = '🎱 배팅할 구슬을 정하고 투입하세요'; updateHUD(); }
  }, 1800);
}
function endGame(){
  state = 'OVER';
  document.getElementById('ovTitle').textContent = '💸 파산...';
  document.getElementById('ovStats').innerHTML =
    `플레이 <b>${rounds}판</b><br>최고 기록 <b>${best.toLocaleString()}개</b>`;
  document.getElementById('overlay').classList.add('show');
  updateHUD();
}
function resetGame(){
  gen++;
  marbles = START_MARBLES; bet = 10; mult = 0; rounds = 0;
  litSlots = []; litChosen = []; balls = []; popups = [];
  particles = []; flash = 0; banner = null;
  charging = false; power = 0; shake = 0;
  roul.spinning = false;
  state = 'BET';
  stateMsg = '🎱 배팅할 구슬을 정하고 투입하세요';
  for (const p of pins) p.f = 0;
  document.getElementById('overlay').classList.remove('show');
  updateHUD();
}

/* ============================================================
   PHYSICS
   ============================================================ */
function plungerTipY(){ return 856 + power*36 - plungerAnim*22; }

function collideSegment(b, x1,y1,x2,y2, rad, e){
  const dx = x2-x1, dy = y2-y1;
  const len2 = dx*dx + dy*dy;
  let t = ((b.x-x1)*dx + (b.y-y1)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const px = x1 + t*dx, py = y1 + t*dy;
  let nx = b.x - px, ny = b.y - py;
  const d = Math.hypot(nx, ny), min = rad + b.r;
  if (d < min && d > 0.0001){
    nx /= d; ny /= d;
    b.x = px + nx*min; b.y = py + ny*min;
    const vn = b.vx*nx + b.vy*ny;
    if (vn < 0){ b.vx -= (1+e)*vn*nx; b.vy -= (1+e)*vn*ny; return -vn; }
    b.contact = true;
    return 0;
  }
  return -1;
}

function stepBall(b, dt){
  if (b.state !== 'live') return;
  b.vy += GRAVITY * dt;
  b.x  += b.vx * dt;
  b.y  += b.vy * dt;
  b.rot += b.vx * dt / b.r;
  b.contact = false;
  const speed = Math.hypot(b.vx, b.vy);

  /* top dome */
  if (b.y < ARC_CY){
    const dx = b.x - W/2, dy = b.y - ARC_CY;
    const d = Math.hypot(dx, dy);
    if (d > ARC_R - b.r){
      const nx = -dx/d, ny = -dy/d;
      b.x = W/2 + dx/d * (ARC_R - b.r);
      b.y = ARC_CY + dy/d * (ARC_R - b.r);
      const vn = b.vx*nx + b.vy*ny;
      if (vn < 0){
        b.vx -= 1.42*vn*nx; b.vy -= 1.42*vn*ny;
        if (-vn > 120) sndWall(-vn);
      }
      b.vx *= 0.996; b.vy *= 0.996;     // dome friction — no free ride to the far wall
      b.contact = true;
      if (b.x < 470) b.launched = true;
    }
  } else {
    if (b.x - b.r < WALL)     { b.x = WALL + b.r;     if (b.vx < 0){ sndWall(-b.vx); b.vx *= -0.45; } b.contact = true; }
    if (b.x + b.r > W - WALL) { b.x = W - WALL - b.r; if (b.vx > 0){ sndWall(b.vx);  b.vx *= -0.45; } b.contact = true; }
  }
  if (b.x < 470) b.launched = true;

  /* launch lane wall */
  collideSegment(b, LANE_X, LANE_TOP, LANE_X, FLOOR_Y, LANE_W, 0.45);

  /* one-way gate over the lane mouth */
  if (b.launched && b.x > LANE_X - LANE_W - b.r && b.y < 296 && b.vy > -50){
    const imp = collideSegment(b, LANE_X - LANE_W, 290, W - WALL, 284, 2.5, 0.3);
    if (imp > 150) sndWall(imp);
  }

  /* nail pins */
  for (const p of pins){
    const dx = b.x - p.x, dy = b.y - p.y;
    const d2 = dx*dx + dy*dy, min = p.r + b.r;
    if (d2 < min*min && d2 > 0.001){
      const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
      b.x = p.x + nx*min; b.y = p.y + ny*min;
      const vn = b.vx*nx + b.vy*ny;
      if (vn < 0){
        const e = 0.42 + Math.random()*0.12;
        b.vx -= (1+e)*vn*nx; b.vy -= (1+e)*vn*ny;
        b.vx += (Math.random()-0.5) * 24;
        sndPin(-vn);
        p.f = 1;
      }
      b.contact = true;
    }
  }

  /* slot dividers */
  for (const dv of dividers){
    const imp = collideSegment(b, dv.x, dv.y1, dv.x, dv.y2, 1.4, 0.38);
    if (imp > 160) sndPin(imp);
  }

  /* floor */
  if (b.y + b.r > FLOOR_Y){
    b.y = FLOOR_Y - b.r;
    if (b.vy > 0){
      if (b.vy > 140) sndWall(b.vy);
      b.vy *= -0.32;
    }
    b.vx *= 0.96;
    b.contact = true;
  }

  /* fell back into the lane → free retry on the plunger */
  if (!b.launched && b.x > LANE_X + LANE_W){
    const tip = plungerTipY();
    if (b.y + b.r > tip){
      b.y = tip - b.r;
      if (b.vy > 0){
        if (b.vy > 180){ sndWall(b.vy); b.vy *= -0.35; }
        else { b.vy = 0; b.vx = 0; b.state = 'ready'; }
      }
      b.contact = true;
    }
  }

  /* anti-stuck nudge */
  if (speed < 8 && b.y < 800 && b.state === 'live'){
    b.slow += dt;
    if (b.slow > 1.2){ b.vx += (Math.random()-0.5)*60; b.vy -= 30; b.slow = 0; }
  } else b.slow = 0;

  /* settled in a hole → resolve the round */
  if (b.launched && b.x < SLOT_R && b.y > 805 && b.contact && speed < 45){
    b.settle += dt;
    if (b.settle > 0.32) resolveRound(b);
  } else b.settle = 0;
}

/* ============================================================
   INPUT
   ============================================================ */
function chargeStart(){
  initAudio();
  if (state !== 'SHOOT') return;
  const b = currentBall();
  if (b && b.state === 'ready' && !charging){
    charging = true; power = 0; lastTickPower = 0;
  }
}
function chargeRelease(){
  if (!charging) return;
  charging = false;
  const b = currentBall();
  if (b && b.state === 'ready' && state === 'SHOOT'){
    b.state = 'live';
    b.launched = false; b.settle = 0; b.slow = 0;
    b.x = PLUNGER_X; b.y = plungerTipY() - b.r;
    b.vy = -(1450 + power*500);     // gentler spring: power controls landing zone
    b.vx = 0;
    sndLaunch(power);
    plungerAnim = 1;
  }
  power = 0;
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); chargeStart(); });
window.addEventListener('pointerup', chargeRelease);
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat){ e.preventDefault(); chargeStart(); }
  if (e.code === 'Enter' && state === 'BET') doInsert();
});
window.addEventListener('keyup', e => { if (e.code === 'Space') chargeRelease(); });
window.addEventListener('blur', chargeRelease);

document.querySelectorAll('#betbar button[data-d]').forEach(btn =>
  btn.addEventListener('click', ()=>{
    bet = Math.max(1, Math.min(bet + (+btn.dataset.d), marbles));
    sndClack(0, 0.12);
    updateHUD();
  }));
document.getElementById('betMax').addEventListener('click', ()=>{
  bet = Math.max(1, marbles); sndClack(0, 0.12); updateHUD();
});
document.getElementById('insert').addEventListener('click', doInsert);
document.getElementById('restart').addEventListener('click', resetGame);

/* ============================================================
   RENDERING — static board on offscreen canvas
   ============================================================ */
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
(function paintBoard(){
  const g = bg.getContext('2d');
  const wood = g.createLinearGradient(0,0,W,H);
  wood.addColorStop(0,'#9a6a38'); wood.addColorStop(0.5,'#8a5c2e'); wood.addColorStop(1,'#7a4f26');
  g.fillStyle = wood; g.fillRect(0,0,W,H);
  g.globalAlpha = 0.14;
  for (let i = 0; i < 52; i++){
    g.strokeStyle = i%2 ? '#5e3c18' : '#b98c52';
    g.lineWidth = 1 + Math.random()*1.6;
    g.beginPath();
    const gx = Math.random()*W;
    g.moveTo(gx, 0);
    g.bezierCurveTo(gx+18, H*0.33, gx-22, H*0.66, gx+10, H);
    g.stroke();
  }
  g.globalAlpha = 1;

  // playfield inset
  g.save();
  g.beginPath();
  g.arc(W/2, ARC_CY, ARC_R, Math.PI, 0);
  g.lineTo(W-WALL, FLOOR_Y); g.lineTo(WALL, FLOOR_Y);
  g.closePath();
  const field = g.createLinearGradient(0,0,0,H);
  field.addColorStop(0,'#7c4f22'); field.addColorStop(1,'#634019');
  g.fillStyle = field; g.fill();
  g.clip();
  g.globalAlpha = 0.1;
  for (let i = 0; i < 34; i++){
    g.strokeStyle = '#3d2407'; g.lineWidth = 1;
    g.beginPath();
    const gx = Math.random()*W;
    g.moveTo(gx,0); g.lineTo(gx + (Math.random()*40-20), H);
    g.stroke();
  }
  g.globalAlpha = 1;
  g.restore();

  // trim
  g.strokeStyle = '#46280c'; g.lineWidth = WALL*2;
  g.beginPath();
  g.arc(W/2, ARC_CY, ARC_R + WALL, Math.PI, 0);
  g.lineTo(W, H); g.lineTo(0, H);
  g.closePath(); g.stroke();
  g.strokeStyle = '#c89b4a'; g.lineWidth = 2.5;
  g.beginPath();
  g.arc(W/2, ARC_CY, ARC_R, Math.PI, 0);
  g.lineTo(W-WALL, FLOOR_Y); g.lineTo(WALL, FLOOR_Y);
  g.closePath(); g.stroke();

  // launch lane wall
  g.fillStyle = '#46280c';
  g.beginPath();
  g.arc(LANE_X, LANE_TOP, LANE_W, Math.PI, 0);
  g.rect(LANE_X-LANE_W, LANE_TOP, LANE_W*2, FLOOR_Y-LANE_TOP);
  g.fill();
  g.strokeStyle = 'rgba(200,155,74,.6)'; g.lineWidth = 1;
  g.strokeRect(LANE_X-LANE_W, LANE_TOP, LANE_W*2, FLOOR_Y-LANE_TOP);

  // lane arrows
  g.fillStyle = 'rgba(255,220,140,.4)';
  for (let y = 810; y > 360; y -= 60){
    g.beginPath();
    g.moveTo(PLUNGER_X, y-9); g.lineTo(PLUNGER_X-8, y+5); g.lineTo(PLUNGER_X+8, y+5);
    g.closePath(); g.fill();
  }

  // one-way gate flap
  g.strokeStyle = '#5a3a14'; g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(LANE_X-LANE_W, 290); g.lineTo(W-WALL, 284); g.stroke();

  // 30 hole pockets + LED housings
  for (let i = 0; i < SLOT_N; i++){
    const x = SLOT_L + SLOT_W*i;
    const grad = g.createLinearGradient(0, SLOT_TOP, 0, FLOOR_Y);
    grad.addColorStop(0, i%2 ? '#56371a' : '#4c2f14');
    grad.addColorStop(1, '#1c0e02');
    g.fillStyle = grad;
    g.fillRect(x+1.4, SLOT_TOP, SLOT_W-2.8, FLOOR_Y-SLOT_TOP);
    // hole opening at the bottom
    g.beginPath();
    g.ellipse(x+SLOT_W/2, FLOOR_Y-7, SLOT_W/2-3, 4.5, 0, 0, Math.PI*2);
    g.fillStyle = '#0a0501'; g.fill();
    // LED housing (off state)
    g.beginPath(); g.arc(x+SLOT_W/2, LED_Y, 3.4, 0, Math.PI*2);
    g.fillStyle = '#3a0a08'; g.fill();
    g.strokeStyle = '#1c0502'; g.lineWidth = 1; g.stroke();
  }

  // dividers
  for (const dv of dividers){
    g.fillStyle = '#3a2008';
    g.beginPath();
    g.arc(dv.x, dv.y1, 1.4, Math.PI, 0);
    g.rect(dv.x-1.4, dv.y1, 2.8, dv.y2-dv.y1);
    g.fill();
    g.fillStyle = 'rgba(255,210,120,.3)';
    g.fillRect(dv.x-0.5, dv.y1, 1, dv.y2-dv.y1);
  }

  // nails
  for (const p of pins){
    g.beginPath(); g.arc(p.x+1, p.y+1.5, p.r, 0, Math.PI*2);
    g.fillStyle = 'rgba(0,0,0,.4)'; g.fill();
    const m = g.createRadialGradient(p.x-1.2, p.y-1.2, 0.4, p.x, p.y, p.r);
    m.addColorStop(0,'#fdfdfd'); m.addColorStop(0.5,'#b9bcc2'); m.addColorStop(1,'#6f7378');
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI*2);
    g.fillStyle = m; g.fill();
  }
})();

const WHEEL_X = W/2, WHEEL_Y = 172, WHEEL_R = 96;
function drawWheel(g, now){
  g.save();
  g.translate(WHEEL_X, WHEEL_Y);
  // rim
  g.beginPath(); g.arc(0, 0, WHEEL_R+9, 0, Math.PI*2);
  g.fillStyle = '#2a1708'; g.fill();
  g.strokeStyle = '#c89b4a'; g.lineWidth = 3; g.stroke();
  // rim lights
  for (let i = 0; i < 12; i++){
    const a = i/12*Math.PI*2 + now/600;
    const on = roul.spinning ? (i + Math.floor(now/90)) % 3 === 0 : (i + Math.floor(now/450)) % 4 === 0;
    g.beginPath();
    g.arc(Math.cos(a)*(WHEEL_R+9), Math.sin(a)*(WHEEL_R+9), 2.6, 0, Math.PI*2);
    g.fillStyle = on ? '#ffe27a' : '#5e3c14';
    g.fill();
  }
  // segments
  g.rotate(roul.angle);
  for (let i = 0; i < SEGS.length; i++){
    const m = SEGS[i];
    g.beginPath();
    g.moveTo(0,0);
    g.arc(0, 0, WHEEL_R, i*SEG_A, (i+1)*SEG_A);
    g.closePath();
    g.fillStyle = MULT_INFO[m].color;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1.2; g.stroke();
    g.save();
    g.rotate((i+0.5)*SEG_A);
    g.translate(WHEEL_R-22, 0);
    g.rotate(Math.PI/2);
    g.fillStyle = m >= 15 ? '#fff' : '#fff';
    g.font = `bold ${m>=10?15:14}px "Segoe UI", sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('×'+m, 0, 0);
    g.restore();
  }
  g.rotate(-roul.angle);
  // hub
  g.beginPath(); g.arc(0, 0, 30, 0, Math.PI*2);
  const hub = g.createRadialGradient(-6,-8,4, 0,0,30);
  hub.addColorStop(0,'#5e4520'); hub.addColorStop(1,'#241405');
  g.fillStyle = hub; g.fill();
  g.strokeStyle = '#c89b4a'; g.lineWidth = 2; g.stroke();
  g.fillStyle = mult ? '#ffd24a' : '#a78d62';
  g.font = 'bold 19px "Segoe UI", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(mult ? '×'+mult : '?', 0, 1);
  g.restore();
  // pointer
  g.beginPath();
  g.moveTo(WHEEL_X, WHEEL_Y - WHEEL_R + 12);
  g.lineTo(WHEEL_X-10, WHEEL_Y - WHEEL_R - 10);
  g.lineTo(WHEEL_X+10, WHEEL_Y - WHEEL_R - 10);
  g.closePath();
  g.fillStyle = '#ff4a3a'; g.fill();
  g.strokeStyle = '#7a1210'; g.lineWidth = 2; g.stroke();
}

function drawMarble(g, b){
  g.beginPath();
  g.ellipse(b.x+1.5, b.y+b.r*0.85, b.r*0.9, b.r*0.45, 0, 0, Math.PI*2);
  g.fillStyle = 'rgba(0,0,0,.3)'; g.fill();
  const grad = g.createRadialGradient(b.x-2.2, b.y-3, 0.8, b.x, b.y, b.r);
  grad.addColorStop(0,'#ffffff');
  grad.addColorStop(0.35, `hsl(${b.hue} 60% 72%)`);
  grad.addColorStop(1, `hsl(${b.hue} 65% 38%)`);
  g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI*2);
  g.fillStyle = grad; g.fill();
  g.save();
  g.beginPath(); g.arc(b.x, b.y, b.r-0.8, 0, Math.PI*2); g.clip();
  g.translate(b.x, b.y); g.rotate(b.rot);
  g.strokeStyle = `hsla(${(b.hue+150)%360} 80% 60% / .75)`;
  g.lineWidth = 1.8;
  g.beginPath(); g.arc(1.5, -0.8, b.r*0.45, 0.4, 3.6); g.stroke();
  g.restore();
  g.beginPath(); g.arc(b.x - b.r*0.35, b.y - b.r*0.4, b.r*0.26, 0, Math.PI*2);
  g.fillStyle = 'rgba(255,255,255,.85)'; g.fill();
}

function render(now){
  const g = cx2d;
  g.save();
  if (shake > 0) g.translate((Math.random()-0.5)*shake*9, (Math.random()-0.5)*shake*9);
  g.drawImage(bg, 0, 0);

  drawWheel(g, now);

  // state message
  g.textAlign = 'center';
  g.font = 'bold 17px "Malgun Gothic", sans-serif';
  g.strokeStyle = 'rgba(0,0,0,.65)'; g.lineWidth = 4;
  g.strokeText(stateMsg, (SLOT_L+SLOT_R)/2, 312);
  g.fillStyle = state === 'RESULT' ? '#ffd24a' : '#f5e9d3';
  g.fillText(stateMsg, (SLOT_L+SLOT_R)/2, 312);

  // lit LEDs + glowing pockets
  const blink = 0.62 + 0.38*Math.sin(now/170);
  for (const i of litSlots){
    const x = SLOT_L + SLOT_W*i;
    // pocket glow
    g.fillStyle = `rgba(255,40,30,${0.16*blink})`;
    g.fillRect(x+1.4, SLOT_TOP, SLOT_W-2.8, FLOOR_Y-SLOT_TOP);
    // LED
    const lx = x+SLOT_W/2;
    const halo = g.createRadialGradient(lx, LED_Y, 0.5, lx, LED_Y, 10);
    halo.addColorStop(0, `rgba(255,70,50,${blink})`);
    halo.addColorStop(1, 'rgba(255,70,50,0)');
    g.beginPath(); g.arc(lx, LED_Y, 10, 0, Math.PI*2);
    g.fillStyle = halo; g.fill();
    g.beginPath(); g.arc(lx, LED_Y, 3.4, 0, Math.PI*2);
    g.fillStyle = `rgba(255,${60+120*blink},40,1)`; g.fill();
  }

  // pin flashes
  for (const p of pins){
    if (p.f > 0.02){
      g.beginPath(); g.arc(p.x, p.y, p.r + 4.5*p.f, 0, Math.PI*2);
      g.fillStyle = `rgba(255,240,170,${p.f*0.8})`; g.fill();
    }
  }

  // plunger
  {
    const tip = plungerTipY();
    g.strokeStyle = '#9aa0a8'; g.lineWidth = 2.2;
    g.beginPath();
    const coils = 7, span = FLOOR_Y - tip - 6;
    for (let i = 0; i <= coils*8; i++){
      const t = i/(coils*8);
      const sx = PLUNGER_X + Math.sin(t*Math.PI*2*coils)*8;
      const sy = tip + 6 + t*span;
      i === 0 ? g.moveTo(sx, sy) : g.lineTo(sx, sy);
    }
    g.stroke();
    g.fillStyle = '#ff8a50';
    g.fillRect(PLUNGER_X-7, tip, 14, 6);
    g.beginPath(); g.arc(PLUNGER_X, tip+8, 6.5, 0, Math.PI*2);
    g.fillStyle = '#d4242a'; g.fill();
    g.strokeStyle = '#7a1216'; g.lineWidth = 1.5; g.stroke();
  }

  // power gauge
  if (charging){
    const gx = 551, gy = 850, gh = 280;
    g.fillStyle = 'rgba(0,0,0,.55)';
    g.fillRect(gx, gy-gh, 7, gh);
    const hue = 120 - power*120;
    g.fillStyle = `hsl(${hue} 90% 55%)`;
    g.fillRect(gx, gy - gh*power, 7, gh*power);
    g.strokeStyle = '#f3d9a4'; g.lineWidth = 1;
    g.strokeRect(gx, gy-gh, 7, gh);
  }

  // marbles
  for (const b of balls){
    if (b.state === 'live'){
      for (let i = 0; i < b.trail.length; i++){
        const tr = b.trail[i], a = (i+1)/b.trail.length;
        g.beginPath(); g.arc(tr.x, tr.y, b.r*a*0.7, 0, Math.PI*2);
        g.fillStyle = `hsla(${b.hue} 70% 70% / ${a*0.22})`; g.fill();
      }
    }
  }
  for (const b of balls){
    if (b.state === 'ready'){ b.x = PLUNGER_X; b.y = plungerTipY() - b.r; }
    drawMarble(g, b);
  }

  // shoot hint
  const cb = currentBall();
  if (state === 'SHOOT' && cb && cb.state === 'ready' && !charging){
    const a = 0.55 + 0.4*Math.sin(now/280);
    g.fillStyle = `rgba(255,230,150,${a})`;
    g.font = 'bold 14px "Malgun Gothic", sans-serif';
    g.textAlign = 'center';
    g.fillText('꾹 눌러 발사! →', 440, 742);
  }

  // payout particles (marble fountain + sparkles)
  for (const p of particles){
    if (p.delay > 0) continue;
    const a = Math.max(0, Math.min(1, p.t / 0.5));
    if (p.spark){
      g.globalAlpha = a;
      const halo = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*3);
      halo.addColorStop(0, '#fff6d0'); halo.addColorStop(0.4, '#ffd24a'); halo.addColorStop(1, 'rgba(255,210,74,0)');
      g.beginPath(); g.arc(p.x, p.y, p.r*3, 0, Math.PI*2);
      g.fillStyle = halo; g.fill();
    } else {
      g.globalAlpha = a;
      const grad = g.createRadialGradient(p.x-p.r*0.3, p.y-p.r*0.4, 0.4, p.x, p.y, p.r);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.4, `hsl(${p.hue} 65% 70%)`);
      grad.addColorStop(1, `hsl(${p.hue} 65% 40%)`);
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI*2);
      g.fillStyle = grad; g.fill();
    }
  }
  g.globalAlpha = 1;

  // popups
  g.textAlign = 'center';
  for (const pp of popups){
    g.globalAlpha = Math.min(1, pp.t);
    g.font = `bold ${pp.size}px "Segoe UI", sans-serif`;
    g.strokeStyle = 'rgba(0,0,0,.7)'; g.lineWidth = 3.5;
    g.strokeText(pp.txt, pp.x, pp.y);
    g.fillStyle = pp.color;
    g.fillText(pp.txt, pp.x, pp.y);
  }
  g.globalAlpha = 1;

  // win banner — bigger win, bigger pop
  if (banner){
    const p = banner.t / banner.dur;
    const grow = Math.min(1, banner.t / 0.22);
    const k = grow - 1;
    const scale = 1 + 2.7*k*k*k + 1.7*k*k;          // ease-out-back pop
    const alpha = p > 0.72 ? 1 - (p - 0.72)/0.28 : 1;
    g.save();
    g.globalAlpha = alpha;
    g.translate((SLOT_L+SLOT_R)/2, 470);
    g.scale(scale, scale);
    g.textAlign = 'center';
    if (banner.tier >= 2){
      g.shadowColor = banner.tier === 3 ? '#ffae00' : '#ffd24a';
      g.shadowBlur = 14 + banner.tier*8;
    }
    g.font = `bold ${15 + banner.tier*3}px "Malgun Gothic", sans-serif`;
    g.strokeStyle = 'rgba(0,0,0,.75)'; g.lineWidth = 5;
    g.strokeText(banner.sub, 0, -34);
    g.fillStyle = banner.tier === 3 ? '#ffae00' : '#ffd24a';
    g.fillText(banner.sub, 0, -34);
    g.font = `bold ${34 + banner.tier*10}px "Segoe UI", sans-serif`;
    g.strokeStyle = 'rgba(0,0,0,.75)'; g.lineWidth = 7;
    g.strokeText(banner.txt, 0, 14);
    const tg = g.createLinearGradient(0, -20, 0, 20);
    tg.addColorStop(0, '#fff6d0'); tg.addColorStop(0.5, '#ffd24a'); tg.addColorStop(1, '#e8930c');
    g.fillStyle = tg;
    g.fillText(banner.txt, 0, 14);
    g.restore();
  }

  // gold flash on wins (stronger for bigger payouts)
  if (flash > 0){
    g.fillStyle = `rgba(255,222,120,${Math.min(0.55, flash*0.5)})`;
    g.fillRect(0, 0, W, H);
  }
  g.restore();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const SUBSTEPS = 8;
let lastT = 0;
function frame(t){
  const dt = Math.min((t - lastT)/1000, 0.022);
  lastT = t;

  // roulette
  if (roul.spinning){
    roul.t += dt;
    const p = Math.min(1, roul.t / roul.dur);
    roul.angle = roul.from + roul.total * (1 - Math.pow(1-p, 3));
    const seg = segUnderPointer();
    if (seg !== roul.lastSeg){ sndTick(); roul.lastSeg = seg; }
    if (p >= 1){ roul.spinning = false; onSpinEnd(); }
  } else if (state === 'BET'){
    roul.angle += dt * 0.25;     // idle drift
  }

  if (state !== 'OVER'){
    if (charging){
      power = Math.min(1, power + dt*0.72);
      if (power - lastTickPower > 0.07 && power < 1){
        sndRatchet(); lastTickPower = power;
      }
    }
    const sub = dt / SUBSTEPS;
    for (let s = 0; s < SUBSTEPS; s++)
      for (const b of balls) stepBall(b, sub);

    const cb = currentBall();
    if (cb && cb.state === 'live'){
      cb.trail.push({ x:cb.x, y:cb.y });
      if (cb.trail.length > 11) cb.trail.shift();
    }
  }

  plungerAnim = Math.max(0, plungerAnim - dt*6);
  shake = Math.max(0, shake - dt*2.2);
  flash = Math.max(0, flash - dt*1.6);
  if (banner){
    banner.t += dt;
    if (banner.t >= banner.dur) banner = null;
  }
  for (let i = particles.length-1; i >= 0; i--){
    const p = particles[i];
    if (p.delay > 0){ p.delay -= dt; continue; }
    p.vy += (p.spark ? 600 : 1400) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (!p.spark && p.y + p.r > FLOOR_Y - 2 && p.vy > 0){   // bounce in the tray
      p.y = FLOOR_Y - 2 - p.r; p.vy *= -0.45; p.vx *= 0.85;
    }
    p.t -= dt;
    if (p.t <= 0 || p.y > H + 40) particles.splice(i, 1);
  }
  for (const p of pins) p.f = Math.max(0, p.f - dt*4);
  for (let i = popups.length-1; i >= 0; i--){
    popups[i].t -= dt; popups[i].y -= dt*34;
    if (popups[i].t <= 0) popups.splice(i, 1);
  }

  updateRollSound();
  render(t);
  requestAnimationFrame(frame);
}

resetGame();
requestAnimationFrame(frame);
</script>
